<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>S. D. Sion Matriculation Hr. Sec. School | Portals Directory</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{font-family:'Plus Jakarta Sans',sans-serif}
    body{
      background:#070b19;
      background-image: 
        radial-gradient(at 0% 0%, rgba(37,99,235,0.22) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(124,58,237,0.2) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(16,185,129,0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(245,158,11,0.12) 0px, transparent 50%);
      background-attachment:fixed;
    }
    .glass{background:rgba(15,23,42,.85);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.07)}
    .school-banner{background:linear-gradient(135deg,#0a1628 0%,#0f2044 40%,#0a1628 100%);border-bottom:3px solid #b8860b}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .float{animation:float 4s ease-in-out infinite}
  </style>
</head>
<body class="min-h-screen text-white flex flex-col">
<div id="root"></div>
<script type="text/babel">
function App(){
  return(
    <div className="min-h-screen flex flex-col">
      {/* Banner */}

        <div className="relative max-w-4xl mx-auto flex flex-col items-center justify-center">

              onError={e=>{e.target.src='school_logo.jpg';}}/>

          <p className="text-xs tracking-widest text-indigo-300/80 uppercase font-semibold mt-2.5">Official Academic Portals · 2025–2026</p>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

                  📘
                </div>

                <p className="text-xs text-slate-400 mt-2 leading-relaxed">
                  Dedicated portal for Class 10 SSLC students. Includes 5 Core Subjects (Tamil, English, Maths, Science, Social) and Class Remarks.

              <a href="login10.html" className="mt-6 w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-xs rounded-2xl shadow-lg shadow-blue-600/30 text-center block">

              </a>
            </div>

            {/* Standard 12 Portal */}
            <div className="glass rounded-3xl p-6 border-t-4 border-purple-500 hover:border-purple-400 transition-all hover:scale-[1.02] flex flex-col justify-between">

              </div>
              <a href="login12.html" className="mt-6 w-full py-3.5 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold text-xs rounded-2xl shadow-lg shadow-purple-600/30 text-center block">
                Open Std 12 Login →
              </a>

              </a>
            </div>

          <p className="text-center text-xs text-slate-500 mt-4">
            S. D. Sion Matriculation Higher Secondary School · Academic Year 2025–2026

        </div>

    </div>

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
