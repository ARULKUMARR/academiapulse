    const INITIAL_EVENTS_ANNOUNCEMENTS = [

    // --- EXCEL PARSING & GENERATION UTILS ---
    const normalizeKeys = (row) => {
      const normalized = {};
      for (const key in row) {
        if (Object.prototype.hasOwnProperty.call(row, key)) {
          const cleanKey = key.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
          normalized[cleanKey] = row[key];
        }
      }
      return normalized;
    };

    const parseExcelFile = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array', cellDates: true });

            const parsedStudents = [];
            const parsedMarks = [];
            const parsedEvents = [];

            const findSheetName = (targetNames) => {
              return workbook.SheetNames.find(name => 
                targetNames.some(tn => name.toLowerCase().trim().includes(tn))
              );
            };

            // 1. Students Sheet
            const studentsSheetName = findSheetName(['student', 'students']);
            if (studentsSheetName) {
              const rawStudents = XLSX.utils.sheet_to_json(workbook.Sheets[studentsSheetName]);
              rawStudents.forEach((row, idx) => {
                const norm = normalizeKeys(row);
                const studentId = norm.studentid || norm.id || `STU-${1001 + idx}`;
                const name = norm.name || norm.studentname || "Unknown Student";
                const grade = norm.grade || norm.class || "Grade 11";
                let attendance = parseFloat(norm.attendance || norm.attendancepercent || 90);
                if (attendance <= 1 && attendance > 0) attendance = attendance * 100;
                const avatarUrl = norm.profileimageurl || norm.avatar || norm.image || `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`;

                parsedStudents.push({
                  studentId: String(studentId).trim(),
                  name: String(name).trim(),
                  grade: String(grade).trim(),
                  attendance: Math.min(100, Math.max(0, Math.round(attendance * 10) / 10)),
                  avatarUrl: String(avatarUrl).trim()
                });
              });
            }

            // 2. Marks Sheet
            const marksSheetName = findSheetName(['mark', 'marks', 'score', 'scores', 'result', 'results']);
            if (marksSheetName) {
              const rawMarks = XLSX.utils.sheet_to_json(workbook.Sheets[marksSheetName]);
              rawMarks.forEach((row) => {
                const norm = normalizeKeys(row);
                const studentId = norm.studentid || norm.id || (parsedStudents[0] ? parsedStudents[0].studentId : "STU-1001");
                const subject = norm.subject || norm.course || "General Subject";
                const examType = norm.testexamtype || norm.examtype || norm.testtype || norm.exam || "Unit Test 1";
                const marksObtained = parseFloat(norm.marksobtained || norm.marks || norm.score || 0);
                const maxMarks = parseFloat(norm.maxmarks || norm.totalmarks || norm.outof || 100);
                let date = norm.date || new Date().toISOString().split('T')[0];
                if (date instanceof Date) date = date.toISOString().split('T')[0];

                parsedMarks.push({
                  studentId: String(studentId).trim(),
                  subject: String(subject).trim(),
                  examType: String(examType).trim(),
                  marksObtained: Math.max(0, marksObtained),
                  maxMarks: Math.max(1, maxMarks),
                  date: String(date).trim()
                });
              });
            }

            // 3. Events Sheet
            const eventsSheetName = findSheetName(['event', 'events', 'announcement', 'announcements', 'news']);
            if (eventsSheetName) {
              const rawEvents = XLSX.utils.sheet_to_json(workbook.Sheets[eventsSheetName]);
              rawEvents.forEach((row, idx) => {
                const norm = normalizeKeys(row);
                const id = norm.id || `EA-${200 + idx}`;
                const type = (norm.type || "Announcement").toLowerCase().includes("event") ? "Event" : "Announcement";
                const title = norm.title || norm.heading || "Notice";
                const description = norm.description || norm.details || norm.desc || "";
                const category = norm.category || "Academic";
                const priority = (norm.priority || "General").toLowerCase().includes("urgent") ? "Urgent" : "General";
                let date = norm.date || new Date().toISOString().split('T')[0];
                if (date instanceof Date) date = date.toISOString().split('T')[0];

                parsedEvents.push({
                  id: String(id).trim(),
                  type,
                  title: String(title).trim(),
                  description: String(description).trim(),
                  date: String(date).trim(),
                  category: String(category).trim(),
                  priority
                });
              });
            }

            resolve({
              students: parsedStudents.length ? parsedStudents : INITIAL_STUDENTS,
              marks: parsedMarks.length ? parsedMarks : INITIAL_MARKS,
              events: parsedEvents.length ? parsedEvents : INITIAL_EVENTS_ANNOUNCEMENTS
            });
          } catch (err) {
            reject(new Error("Error parsing Excel file format: " + err.message));
          }
        };
        reader.onerror = (err) => reject(err);
        reader.readAsArrayBuffer(file);
      });
    };

    const downloadSampleExcel = (studentsData = INITIAL_STUDENTS, marksData = INITIAL_MARKS, eventsData = INITIAL_EVENTS_ANNOUNCEMENTS) => {
      const wb = XLSX.utils.book_new();

      const formattedStudents = studentsData.map(s => ({
        "Student ID": s.studentId,
        "Name": s.name,
        "Grade": s.grade,
        "Attendance (%)": s.attendance,
        "Profile Image URL": s.avatarUrl
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(formattedStudents), "Students");

      const formattedMarks = marksData.map(m => ({
        "Student ID": m.studentId,
        "Subject": m.subject,
        "Test/Exam Type": m.examType,
        "Marks Obtained": m.marksObtained,
        "Max Marks": m.maxMarks,
        "Date": m.date
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(formattedMarks), "Marks");

      const formattedEvents = eventsData.map(e => ({
        "ID": e.id,
        "Type": e.type,
        "Title": e.title,
        "Description": e.description,
        "Date": e.date,
        "Category": e.category,
        "Priority": e.priority
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(formattedEvents), "Events & Announcements");

      XLSX.writeFile(wb, "AcademiaPulse_Academic_Database.xlsx");
    };

    // Helper Grade Badges
    const getGradeBadge = (pct) => {
      if (pct >= 90) return { label: 'A+', color: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' };
      if (pct >= 80) return { label: 'A', color: 'bg-teal-500/20 text-teal-400 border-teal-500/40' };
      if (pct >= 70) return { label: 'B', color: 'bg-indigo-500/20 text-indigo-400 border-indigo-500/40' };
      if (pct >= 60) return { label: 'C', color: 'bg-amber-500/20 text-amber-400 border-amber-500/40' };
      return { label: 'F', color: 'bg-rose-500/20 text-rose-400 border-rose-500/40' };

    // --- MAIN APP COMPONENT ---
    function App() {

      const [marks, setMarks] = useState(INITIAL_MARKS);
      const [events, setEvents] = useState(INITIAL_EVENTS_ANNOUNCEMENTS);
      
      const [currentStudent, setCurrentStudent] = useState(INITIAL_STUDENTS[0]);
      const [selectedReportCardStudent, setSelectedReportCardStudent] = useState(null);

      const [selectedTerm, setSelectedTerm] = useState('All');
      const [searchMarksQuery, setSearchMarksQuery] = useState('');
      const [filterCategory, setFilterCategory] = useState('All');
      
      const [directorySearch, setDirectorySearch] = useState('');
      const [directoryGrade, setDirectoryGrade] = useState('All');

      const [isDragging, setIsDragging] = useState(false);
      const [uploadLoading, setUploadLoading] = useState(false);
      const [uploadStatus, setUploadStatus] = useState(null);

      // Broadcast form state
      const [bType, setBType] = useState('Announcement');
      const [bTitle, setBTitle] = useState('');
      const [bDesc, setBDesc] = useState('');
      const [bDate, setBDate] = useState(new Date().toISOString().split('T')[0]);
      const [bCategory, setBCategory] = useState('Academic');
      const [bPriority, setBPriority] = useState('General');
      const [bSuccess, setBSuccess] = useState(false);

      // Re-trigger Lucide icon renders on dynamic updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const handleExcelSync = async (file) => {
        if (!file) return;
        setUploadLoading(true);
        setUploadStatus(null);
        try {
          const res = await parseExcelFile(file);
          setStudents(res.students);
          setMarks(res.marks);
          setEvents(res.events);
          if (res.students.length > 0) setCurrentStudent(res.students[0]);
          setUploadStatus({ type: 'success', text: `Database synchronized! Loaded ${res.students.length} Students, ${res.marks.length} Marks, and ${res.events.length} Events/Notices.` });
        } catch (err) {
          setUploadStatus({ type: 'error', text: err.message });
        } finally {
          setUploadLoading(false);
        }
      };

      const handleBroadcastSubmit = (e) => {
        e.preventDefault();
        if (!bTitle.trim() || !bDesc.trim()) return;
        const newRecord = {
          id: `EA-${Date.now().toString().slice(-4)}`,
          type: bType,
          title: bTitle.trim(),
          description: bDesc.trim(),
          date: bDate,
          category: bCategory,
          priority: bPriority
        };
        setEvents(prev => [newRecord, ...prev]);
        setBTitle('');
        setBDesc('');
        setBSuccess(true);
        setTimeout(() => setBSuccess(false), 3000);
      };

      // Compute student-specific metrics
      const studentMarks = marks.filter(m => m.studentId === currentStudent?.studentId);
      const studentAvgPct = studentMarks.length > 0
        ? Math.round(studentMarks.reduce((acc, m) => acc + (m.marksObtained / m.maxMarks) * 100, 0) / studentMarks.length)
        : 0;

      // Subject Aggregates
      const subjectAggregates = {};
      studentMarks.forEach(m => {
        if (!subjectAggregates[m.subject]) subjectAggregates[m.subject] = { obtained: 0, max: 0 };
        subjectAggregates[m.subject].obtained += m.marksObtained;
        subjectAggregates[m.subject].max += m.maxMarks;
      });
      const subjectProgressList = Object.entries(subjectAggregates).map(([sub, d]) => ({
        subject: sub,
        pct: Math.round((d.obtained / d.max) * 100)
      }));

      // Terms
      const examTerms = ['All', ...new Set(studentMarks.map(m => m.examType))];
      const filteredMarks = studentMarks.filter(m => {
        const matchesTerm = selectedTerm === 'All' || m.examType.toLowerCase().includes(selectedTerm.toLowerCase());
        const matchesSearch = m.subject.toLowerCase().includes(searchMarksQuery.toLowerCase());
        return matchesTerm && matchesSearch;
      });

      // Announcements
      const announcements = events.filter(e => e.type.toLowerCase().includes('announcement'));
      const categories = ['All', ...new Set(announcements.map(a => a.category))];
      const filteredAnnouncements = announcements.filter(a => filterCategory === 'All' || a.category === filterCategory);

      // Events Countdown Helper
      const upcomingEvents = events.filter(e => e.type.toLowerCase().includes('event'));
      const getCountdownLabel = (evtDate) => {
        const today = new Date(); today.setHours(0,0,0,0);
        const target = new Date(evtDate); target.setHours(0,0,0,0);
        const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
        if (diff === 0) return { text: "Today!", style: "bg-rose-500/20 text-rose-300 border-rose-500/40" };
        if (diff === 1) return { text: "Tomorrow", style: "bg-amber-500/20 text-amber-300 border-amber-500/40" };
        if (diff > 1) return { text: `In ${diff} days`, style: "bg-indigo-500/20 text-indigo-300 border-indigo-500/40" };
        return { text: "Past Event", style: "bg-slate-800 text-slate-400 border-slate-700" };
      };

      // Admin Directory
      const directoryGrades = ['All', ...new Set(students.map(s => s.grade))];
      const studentSummaries = students.map(s => {
        const sm = marks.filter(m => m.studentId === s.studentId);
        const avg = sm.length > 0 ? Math.round(sm.reduce((acc, m) => acc + (m.marksObtained / m.maxMarks) * 100, 0) / sm.length) : 0;
        return { ...s, examCount: sm.length, avgScore: avg };
      });
      const filteredDirectory = studentSummaries.filter(s => {
        const matchesSearch = s.name.toLowerCase().includes(directorySearch.toLowerCase()) || s.studentId.toLowerCase().includes(directorySearch.toLowerCase());
        const matchesGrade = directoryGrade === 'All' || s.grade === directoryGrade;
        return matchesSearch && matchesGrade;
      });

      // --- LOGIN VIEW ---
      if (userRole === 'login') {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4 sm:p-6 relative overflow-hidden">

                  >
                    <input type="file" accept=".xlsx, .xls" onChange={(e) => e.target.files[0] && handleExcelSync(e.target.files[0])} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                    <div className="flex flex-col items-center justify-center space-y-2 pointer-events-none">
                      <div className="w-12 h-12 rounded-2xl bg-indigo-500/10 flex items-center justify-center text-indigo-400">
                        <i data-lucide="upload-cloud" className="w-6 h-6"></i>
                      </div>
                      <p className="text-sm font-bold text-white">Drag & Drop Excel File Here, or Click to Browse</p>
                      <p className="text-xs text-slate-400">Supports .xlsx & .xls format • Real-time workbook parser</p>
                    </div>
                  </div>

                  {uploadStatus && (
                    <div className={`mt-4 p-3 rounded-xl border text-xs flex items-center space-x-2 ${uploadStatus.type === 'success' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' : 'bg-rose-500/10 border-rose-500/30 text-rose-300'}`}>
                      <i data-lucide="check-circle-2" className="w-4 h-4"></i>
                      <span>{uploadStatus.text}</span>
                    </div>
                  )}
                </div>

                {/* Directory */}
                <div className="glass-panel rounded-3xl p-6 sm:p-8 border border-slate-800">
                  <div className="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                    <div>
                      <h2 className="text-xl font-bold text-white flex items-center space-x-2">
                        <i data-lucide="users" className="w-5 h-5 text-indigo-400"></i>
                        <span>Student Directory & Report Cards</span>
                      </h2>
                      <p className="text-xs text-slate-400">Search and inspect individual student transcripts</p>
                    </div>

                    <div className="flex items-center space-x-3">
                      <input
                        type="text"
                        placeholder="Search student..."
                        value={directorySearch}
                        onChange={(e) => setDirectorySearch(e.target.value)}
                        className="py-1.5 px-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white"
                      />
                      <select
                        value={directoryGrade}
                        onChange={(e) => setDirectoryGrade(e.target.value)}
                        className="py-1.5 px-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white"
                      >
                        {directoryGrades.map(g => <option key={g} value={g}>{g}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="overflow-x-auto rounded-2xl border border-slate-800">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-900 border-b border-slate-800 text-[11px] font-bold uppercase text-slate-400">
                        <tr>
                          <th className="py-3 px-4">Student</th>
                          <th className="py-3 px-4">Grade</th>
                          <th className="py-3 px-4 text-center">Exams Logged</th>
                          <th className="py-3 px-4 text-center">Avg %</th>
                          <th className="py-3 px-4 text-center">Attendance</th>
                          <th className="py-3 px-4 text-right">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {filteredDirectory.map(stu => (
                          <tr key={stu.studentId} className="hover:bg-slate-900/40">
                            <td className="py-3 px-4 font-bold text-white flex items-center space-x-3">
                              <img src={stu.avatarUrl} alt={stu.name} className="w-8 h-8 rounded-full object-cover" />
                              <div>
                                <p className="font-bold text-white">{stu.name}</p>
                                <p className="text-[10px] text-slate-400">{stu.studentId}</p>
                              </div>
                            </td>
                            <td className="py-3 px-4 text-slate-300">{stu.grade}</td>
                            <td className="py-3 px-4 text-center font-bold">{stu.examCount}</td>
                            <td className="py-3 px-4 text-center font-extrabold text-indigo-400">{stu.avgScore}%</td>
                            <td className="py-3 px-4 text-center font-bold text-emerald-400">{stu.attendance}%</td>
                            <td className="py-3 px-4 text-right">
                              <button
                                onClick={() => setSelectedReportCardStudent(stu)}
                                className="px-3 py-1.5 text-xs font-bold text-indigo-300 bg-indigo-500/20 hover:bg-indigo-500/30 rounded-xl border border-indigo-500/30"
                              >
                                View Report Card
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* Broadcast Form */}
                <div className="glass-panel rounded-3xl p-6 sm:p-8 border border-slate-800">
                  <h2 className="text-xl font-bold text-white mb-4 flex items-center space-x-2">
                    <i data-lucide="send" className="w-5 h-5 text-pink-400"></i>
                    <span>Quick Broadcast Center</span>
                  </h2>

                  <form onSubmit={handleBroadcastSubmit} className="space-y-4">
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-300 mb-1">Type</label>
                        <select value={bType} onChange={(e) => setBType(e.target.value)} className="w-full py-2 px-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white">
                          <option value="Announcement">Daily Announcement</option>
                          <option value="Event">Upcoming Event</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-300 mb-1">Category</label>
                        <select value={bCategory} onChange={(e) => setBCategory(e.target.value)} className="w-full py-2 px-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white">
                          <option value="Academic">Academic</option>
                          <option value="Sports">Sports</option>
                          <option value="Holiday">Holiday</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-300 mb-1">Priority</label>
                        <select value={bPriority} onChange={(e) => setBPriority(e.target.value)} className="w-full py-2 px-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white">
                          <option value="General">General Notice</option>
                          <option value="Urgent">Urgent Priority</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      <div className="sm:col-span-2">
                        <label className="block text-xs font-bold text-slate-300 mb-1">Title</label>
                        <input type="text" required value={bTitle} onChange={(e) => setBTitle(e.target.value)} placeholder="Notice title..." className="w-full py-2 px-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-300 mb-1">Date</label>
                        <input type="date" required value={bDate} onChange={(e) => setBDate(e.target.value)} className="w-full py-2 px-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white" />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1">Description</label>
                      <textarea rows="3" required value={bDesc} onChange={(e) => setBDesc(e.target.value)} placeholder="Provide notice details..." className="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white"></textarea>
                    </div>

                    {bSuccess && (
                      <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-xs text-emerald-300">
                        Broadcast published! Real-time feeds updated across all student accounts.
                      </div>
                    )}

                    <button type="submit" className="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold text-xs rounded-xl shadow-lg">
                      Publish Notice
                    </button>
                  </form>
                </div>

              </div>
            )}

          </main>

          {/* REPORT CARD MODAL */}
          {selectedReportCardStudent && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="w-full max-w-2xl glass-panel rounded-3xl border border-slate-800 p-6 space-y-6">
                <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                  <h2 className="text-xl font-bold text-white">Academic Report Card</h2>
                  <button onClick={() => setSelectedReportCardStudent(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="flex items-center space-x-4 bg-slate-900 p-4 rounded-2xl border border-slate-800">
                  <img src={selectedReportCardStudent.avatarUrl} alt={selectedReportCardStudent.name} className="w-14 h-14 rounded-2xl object-cover" />
                  <div>
                    <h3 className="text-lg font-bold text-white">{selectedReportCardStudent.name}</h3>
                    <p className="text-xs text-slate-400">{selectedReportCardStudent.grade} • {selectedReportCardStudent.studentId}</p>
                  </div>
                </div>

                <div className="overflow-x-auto rounded-xl border border-slate-800">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-900 text-slate-400 font-bold uppercase">
                      <tr>
                        <th className="py-2.5 px-3">Subject</th>
                        <th className="py-2.5 px-3">Exam</th>
                        <th className="py-2.5 px-3 text-center">Score</th>
                        <th className="py-2.5 px-3 text-center">Grade</th>
                        <th className="py-2.5 px-3 text-right">Date</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {marks.filter(m => m.studentId === selectedReportCardStudent.studentId).map((m, i) => {
                        const pct = Math.round((m.marksObtained / m.maxMarks) * 100);
                        const b = getGradeBadge(pct);
                        return (
                          <tr key={i}>
                            <td className="py-2.5 px-3 font-bold text-white">{m.subject}</td>
                            <td className="py-2.5 px-3 text-slate-300">{m.examType}</td>
                            <td className="py-2.5 px-3 text-center font-bold">{m.marksObtained}/{m.maxMarks}</td>
                            <td className="py-2.5 px-3 text-center"><span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${b.color}`}>{b.label} ({pct}%)</span></td>
                            <td className="py-2.5 px-3 text-right text-slate-400 font-mono text-[10px]">{m.date}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>

                <div className="text-right">
                  <button onClick={() => window.print()} className="px-4 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl mr-2">Print Report</button>
                  <button onClick={() => setSelectedReportCardStudent(null)} className="px-4 py-2 bg-slate-800 text-slate-300 font-bold text-xs rounded-xl">Close</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
</html>
