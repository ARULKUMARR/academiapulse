<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login | S. D. Sion Matriculation</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{font-family:'Plus Jakarta Sans',sans-serif}
    body{
      background:#080718;
      background-image: 
        radial-gradient(at 0% 0%, rgba(245,158,11,0.22) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(124,58,237,0.18) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(16,185,129,0.15) 0px, transparent 50%);
      background-attachment:fixed;
    }
    .glass{background:rgba(15,23,42,.85);backdrop-filter:blur(24px);border:1px solid rgba(245,158,11,.2)}
    .school-banner{background:linear-gradient(135deg,#0a1628 0%,#0f2044 40%,#0a1628 100%);border-bottom:3px solid #b8860b}
    .gmail-input{transition:all .2s;border:2px solid rgba(245,158,11,.25)}
    .gmail-input:focus{border-color:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.2);outline:none}
  </style>
</head>
<body class="min-h-screen text-white flex flex-col">
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

function App(){
  const [passcode, setPasscode]=useState('');
  const [error, setError]=useState('');
  const [loading, setLoading]=useState(false);

  const handleLogin=e=>{
    e.preventDefault();
    setError('');
    if(passcode !== 'admin123'){
      setError('Invalid Admin Passcode.');
      return;
    }
    setLoading(true);
    setTimeout(()=>{
      localStorage.setItem('ap_auth','admin');
      window.location.href = 'admin.html';
    }, 400);
  };

  return(
    <div className="min-h-screen flex flex-col">
      {/* Banner */}
      <div className="school-banner py-5 px-4 text-center relative overflow-hidden bg-slate-900/90">
        <div className="relative max-w-4xl mx-auto flex flex-col items-center justify-center">
          <div className="bg-white rounded-2xl p-3 shadow-2xl border border-white/20 inline-block max-w-full">
            <img src="school_logo.png" alt="S. D. Sion Matriculation" className="h-16 max-w-full object-contain mx-auto" onError={e=>{e.target.src='school_logo.jpg';}}/>
          </div>
          <p className="text-xs tracking-widest text-amber-300 uppercase font-bold mt-2.5">Administrator &amp; Faculty Control Portal</p>
        </div>
      </div>

      {/* Login Box */}
      <div className="flex-1 flex items-center justify-center p-4">
        <div className="w-full max-w-md">

          <div className="glass rounded-3xl p-6 sm:p-8 shadow-2xl">
            <div className="mb-6 text-center">
              <div className="w-16 h-16 rounded-2xl bg-amber-600/20 border border-amber-500/40 mx-auto flex items-center justify-center text-3xl mb-3">
                🛡️
              </div>
              <h1 className="text-2xl font-extrabold text-white">Admin Authentication</h1>
              <p className="text-xs text-slate-400 mt-1">Enter your administrator passcode to access system management</p>
            </div>

            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="block text-[11px] font-bold text-amber-400 uppercase tracking-wider mb-2">
                  Admin Security Passcode
                </label>
                <div className="relative">
                  <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔑</span>
                  <input 
                    type="password" 
                    value={passcode} 
                    onChange={e=>setPasscode(e.target.value)}
                    required
                    autoFocus
                    placeholder="Enter passcode..."
                    className="gmail-input w-full pl-10 pr-4 py-3.5 bg-slate-900/80 rounded-xl text-sm text-white placeholder-slate-500"
                  />
                </div>
              </div>

              {error&&<div className="p-3.5 bg-rose-500/10 border border-rose-500/30 rounded-xl text-xs text-rose-300 font-medium">{error}</div>}

              <button type="submit" disabled={loading}
                className="w-full py-3.5 bg-amber-600 text-white font-bold text-sm rounded-xl shadow-lg shadow-amber-600/30 flex items-center justify-center gap-2 hover:scale-[1.01] transition-all">
                {loading ? <span className="animate-spin text-base">⚙️</span> : 'Authenticate & Enter Admin Portal →'}
              </button>
            </form>
          </div>

        </div>
      </div>

      <footer className="py-3 border-t border-slate-800 text-center text-xs text-slate-500">
        S. D. Sion Matriculation Higher Secondary School · Administrative System
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
