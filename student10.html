<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>S. D. Sion Matriculation | Standard 10 Student Portal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{font-family:'Plus Jakarta Sans',sans-serif}
    body{
      background:#070b19;
      background-image: 
        radial-gradient(at 0% 0%, rgba(37,99,235,0.22) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(124,58,237,0.2) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(16,185,129,0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(245,158,11,0.12) 0px, transparent 50%);
      background-attachment:fixed;
    }
    .glass{background:rgba(15,23,42,.82);backdrop-filter:blur(24px);border:1px solid rgba(59,130,246,.25)}
    .glass-dark{background:rgba(6,9,26,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(59,130,246,.2)}
    .school-banner{background:linear-gradient(135deg,#0a1628 0%,#0f2044 40%,#0a1628 100%);border-bottom:3px solid #f59e0b}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:rgba(6,9,26,.6)}
    ::-webkit-scrollbar-thumb{background:rgba(59,130,246,.4);border-radius:99px}
    @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .slide-up{animation:slideUp .35s ease forwards}
  </style>
</head>
<body class="min-h-screen text-white flex flex-col">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const STD_10_SUBJECTS = ["Tamil", "English", "Mathematics", "Science", "Social Science"];
const ALL_EXAMS = ["1st Midterm", "Quarterly Exam", "2nd Midterm", "Half Yearly Exam", "3rd Midterm", "Annual Exam"];

const DEFAULT_VISIBILITY = {
  "1st Midterm": true,
  "Quarterly Exam": false,
  "2nd Midterm": false,
  "Half Yearly Exam": false,
  "3rd Midterm": false,
  "Annual Exam": false
};

const DEFAULT_STUDENTS = [
  { studentId:"STU-1001", name:"Alex Johnson",    standard:"10", section:"A", gmail:"alex.johnson@gmail.com",     rollNo:"10-A-01", attendance:94.5, avatarUrl:"https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&q=80" },
  { studentId:"STU-1002", name:"Sophia Chen",     standard:"10", section:"B", gmail:"sophia.chen@gmail.com",      rollNo:"10-B-02", attendance:98.0, avatarUrl:"https://images.unsplash.com/photo-1517841905240-472988babdf9?w=200&q=80" },
  { studentId:"STU-1006", name:"Priya Sharma",    standard:"10", section:"A", gmail:"priya.sharma@gmail.com",     rollNo:"10-A-06", attendance:91.0, avatarUrl:"https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?w=200&q=80" },
  { studentId:"STU-1007", name:"Rohan Mehta",     standard:"10", section:"C", gmail:"rohan.mehta@gmail.com",      rollNo:"10-C-07", attendance:82.5, avatarUrl:"https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=200&q=80" },
];

const DEFAULT_MARKS = [
  {studentId:"STU-1001",standard:"10",subject:"Tamil",          examType:"1st Midterm",      marksObtained:45, maxMarks:50, date:"2026-06-15"},
  {studentId:"STU-1001",standard:"10",subject:"English",        examType:"1st Midterm",      marksObtained:46, maxMarks:50, date:"2026-06-18"},
  {studentId:"STU-1001",standard:"10",subject:"Mathematics",   examType:"1st Midterm",      marksObtained:48, maxMarks:50, date:"2026-06-20"},
  {studentId:"STU-1001",standard:"10",subject:"Science",        examType:"1st Midterm",      marksObtained:44, maxMarks:50, date:"2026-06-22"},
  {studentId:"STU-1001",standard:"10",subject:"Social Science", examType:"1st Midterm",      marksObtained:43, maxMarks:50, date:"2026-06-25"},
];

const DEFAULT_SLIPTESTS = [
  {id:"ST-101", studentId:"STU-1001", standard:"10", subject:"Tamil",          testName:"Slip Test 1", marksObtained:23, maxMarks:25, date:"2026-07-20"},
  {id:"ST-102", studentId:"STU-1001", standard:"10", subject:"English",        testName:"Slip Test 1", marksObtained:24, maxMarks:25, date:"2026-07-22"},
  {id:"ST-103", studentId:"STU-1001", standard:"10", subject:"Mathematics",   testName:"Slip Test 1", marksObtained:25, maxMarks:25, date:"2026-07-25"},
  {id:"ST-104", studentId:"STU-1001", standard:"10", subject:"Science",        testName:"Slip Test 1", marksObtained:22, maxMarks:25, date:"2026-07-27"},
  {id:"ST-105", studentId:"STU-1001", standard:"10", subject:"Social Science", testName:"Slip Test 1", marksObtained:21, maxMarks:25, date:"2026-07-29"},
];

const DEFAULT_NOTICES = [
  {id:"NTC-01", category:"Remarks",         icon:"📝", title:"Teacher's Academic Remarks",        date:"2026-07-30", description:"Demonstrates high proficiency in Mathematics & Science. Practice Tamil literature writing speed."},
  {id:"NTC-02", category:"Upcoming Events", icon:"📅", title:"Annual Science Exhibition 2026",    date:"2026-08-05", description:"Class 10 project submission deadline is Aug 15. All teams register with science faculty."},
  {id:"NTC-03", category:"Others",          icon:"📌", title:"Library Extended Evening Hours",   date:"2026-07-28", description:"Library and digital computer lab remain open until 7:30 PM for SSLC exam preparation."},
];

function seedData(){
  if(!localStorage.getItem('ap_students_v10')) localStorage.setItem('ap_students_v10', JSON.stringify(DEFAULT_STUDENTS));
  if(!localStorage.getItem('ap_marks_v10'))    localStorage.setItem('ap_marks_v10', JSON.stringify(DEFAULT_MARKS));
  if(!localStorage.getItem('ap_sliptests_v10')) localStorage.setItem('ap_sliptests_v10', JSON.stringify(DEFAULT_SLIPTESTS));
  if(!localStorage.getItem('ap_notices_v10'))  localStorage.setItem('ap_notices_v10', JSON.stringify(DEFAULT_NOTICES));
}

const gradeInfo = pct => {
  if(pct>=90)return{label:'A+',badge:'text-emerald-400 bg-emerald-500/15 border-emerald-500/30',bar:'bg-gradient-to-r from-emerald-500 to-teal-400'};
  if(pct>=80)return{label:'A', badge:'text-teal-400 bg-teal-500/15 border-teal-500/30',bar:'bg-gradient-to-r from-teal-500 to-blue-400'};
  if(pct>=70)return{label:'B', badge:'text-blue-400 bg-blue-500/15 border-blue-500/30',bar:'bg-gradient-to-r from-blue-500 to-indigo-400'};
  if(pct>=60)return{label:'C', badge:'text-amber-400 bg-amber-500/15 border-amber-500/30',bar:'bg-gradient-to-r from-amber-500 to-yellow-400'};
  return        {label:'F', badge:'text-rose-400 bg-rose-500/15 border-rose-500/30',bar:'bg-gradient-to-r from-rose-600 to-rose-400'};
};

function App(){
  const [student, setStudent]=useState(null);
  const [marks, setMarks]=useState([]);
  const [slipTests, setSlipTests]=useState([]);
  const [notices, setNotices]=useState([]);
  const [tab, setTab]=useState('dashboard');
  const [examFilter, setExamFilter]=useState('All');
  const [examVis, setExamVis]=useState(DEFAULT_VISIBILITY);
  
  // Slip Test Form State
  const [showSlipModal, setShowSlipModal]=useState(false);
  const [slipForm, setSlipForm]=useState({
    subject:'Tamil',
    testName:'Slip Test 2',
    marksObtained:'',
    maxMarks:'25',
    date: new Date().toISOString().split('T')[0]
  });

  useEffect(()=>{
    seedData();
    const currentId=localStorage.getItem('ap_current_student');
    const currentGmail=localStorage.getItem('ap_current_gmail');
    const students=JSON.parse(localStorage.getItem('ap_students_v10')||'[]');
    
    const found=students.find(s=>s.studentId===currentId && s.gmail.toLowerCase()===(currentGmail||'').toLowerCase());
    if(!found){ window.location.href='login10.html'; return; }

    setStudent(found);

    // Read Admin Exam Visibility settings
    const visSettings = JSON.parse(localStorage.getItem('ap_exam_visibility') || '{}');
    const std10Vis = visSettings.std10 || DEFAULT_VISIBILITY;
    setExamVis(std10Vis);

    const allMarks=JSON.parse(localStorage.getItem('ap_marks_v10')||'[]');
    // Filter marks so ONLY published/visible exam types are shown to student!
    const visibleMarks = allMarks.filter(m=>m.studentId===found.studentId && (std10Vis[m.examType] !== false));
    setMarks(visibleMarks);

    const allSlip=JSON.parse(localStorage.getItem('ap_sliptests_v10')||'[]');
    setSlipTests(allSlip.filter(st=>st.studentId===found.studentId));

    setNotices(JSON.parse(localStorage.getItem('ap_notices_v10')||'[]'));
  },[]);

  if(!student) return null;

  const handleAddSlipTest = e => {
    e.preventDefault();
    const ob = parseFloat(slipForm.marksObtained);
    const mx = parseFloat(slipForm.maxMarks);
    if(isNaN(ob) || isNaN(mx) || mx <= 0 || ob > mx) return;

    const newTest = {
      id: `ST-${Date.now()}`,
      studentId: student.studentId,
      standard: '10',
      subject: slipForm.subject,
      testName: slipForm.testName,
      marksObtained: ob,
      maxMarks: mx,
      date: slipForm.date
    };

    const allSlip=JSON.parse(localStorage.getItem('ap_sliptests_v10')||'[]');
    const updated = [newTest, ...allSlip];
    localStorage.setItem('ap_sliptests_v10', JSON.stringify(updated));

    setSlipTests(updated.filter(st=>st.studentId===student.studentId));
    setShowSlipModal(false);
    setSlipForm({subject:'Tamil', testName:'Slip Test 2', marksObtained:'', maxMarks:'25', date:new Date().toISOString().split('T')[0]});
  };

  // Published Exam List for Filter Buttons
  const publishedExams = ["All", ...ALL_EXAMS.filter(e => examVis[e] !== false)];

  const filteredMarks = examFilter === 'All' ? marks : marks.filter(m => m.examType === examFilter);

  // Calculations
  const slipOb = slipTests.reduce((a, st) => a + st.marksObtained, 0);
  const slipMx = slipTests.reduce((a, st) => a + st.maxMarks, 0);
  const slipPct = slipMx ? Math.round((slipOb / slipMx) * 100) : 0;

  const totalOb = marks.reduce((a, m) => a + m.marksObtained, 0);
  const totalMx = marks.reduce((a, m) => a + m.maxMarks, 0);
  const overall = totalMx ? Math.round((totalOb / totalMx) * 100) : 0;

  return(
    <div className="min-h-screen flex flex-col">
      {/* Banner */}
      <div className="school-banner py-5 px-4 text-center relative overflow-hidden">
        <div className="max-w-4xl mx-auto flex flex-col items-center justify-center">
          <div className="bg-white/95 rounded-2xl p-3 shadow-2xl border border-white/20 inline-block max-w-full">
            <img src="school_logo.png" alt="S. D. Sion Matriculation" className="h-16 max-w-full object-contain mx-auto" onError={e=>{e.target.src='school_logo.jpg';}}/>
          </div>
          <p className="text-xs tracking-widest text-amber-300 uppercase font-bold mt-2.5">Standard 10 Student Academic Portal</p>
        </div>
      </div>

      {/* Header Nav */}
      <header className="sticky top-0 z-40 glass-dark">
        <div className="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <span className="px-2.5 py-1 text-xs font-black bg-blue-600/30 text-blue-300 border border-blue-500/40 rounded-full">📘 Std 10</span>
            <span className="text-xs font-bold text-white hidden sm:inline">{student.name}</span>
          </div>

          <nav className="flex gap-1">
            {[['dashboard','🏠 Dashboard'],['sliptests','📝 Slip Tests'],['marks','📊 Exam Marks'],['notices','🔔 Notices']].map(([id,label])=>(
              <button key={id} onClick={()=>setTab(id)}
                className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${tab===id?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'text-slate-400 hover:text-white'}`}>{label}</button>
            ))}
          </nav>

          <a href="login10.html" className="text-xs text-rose-400 hover:text-rose-300 font-bold border border-rose-500/20 px-2.5 py-1 rounded-lg">Sign Out 🚪</a>
        </div>
      </header>

      {/* Main Content */}
      <main className="flex-1 max-w-5xl w-full mx-auto px-4 py-6">

        {tab==='dashboard'&&(
          <div className="space-y-6 slide-up">
            {/* Student Banner */}
            <div className="glass rounded-3xl p-6 relative overflow-hidden border-l-4 border-blue-500">
              <div className="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                <img src={student.avatarUrl} alt="" className="w-16 h-16 rounded-2xl object-cover ring-4 ring-blue-500/30"/>
                <div className="flex-1">
                  <div className="flex items-center gap-2">
                    <h1 className="text-2xl font-extrabold text-white">{student.name}</h1>
                    <span className="px-2.5 py-0.5 text-xs font-extrabold bg-blue-500/20 text-blue-300 border border-blue-500/30 rounded-full">Section {student.section}</span>
                  </div>
                  <p className="text-xs text-slate-400 mt-1">Roll No: <strong className="text-white">{student.rollNo}</strong> · Gmail: <strong className="text-white">{student.gmail}</strong></p>
                </div>

                <div className="flex gap-3">
                  <div className="bg-blue-600/20 border border-blue-500/40 rounded-2xl px-4 py-3 text-center">
                    <p className="text-2xl font-extrabold text-white">{overall}%</p>
                    <p className="text-[10px] font-bold text-blue-300 uppercase">Published Exam Avg</p>
                  </div>
                  <div className="bg-emerald-600/20 border border-emerald-500/40 rounded-2xl px-4 py-3 text-center">
                    <p className="text-2xl font-extrabold text-emerald-300">{slipPct}%</p>
                    <p className="text-[10px] font-bold text-emerald-300 uppercase">Slip Test Total</p>
                  </div>
                </div>
              </div>
            </div>

            {/* Slip Test Summary Card */}
            <div className="glass rounded-3xl p-6 bg-gradient-to-r from-emerald-950/40 to-teal-950/40 border border-emerald-500/30">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">📝</span>
                    <h2 className="text-xl font-extrabold text-white">Class 10 Slip Test Total Summary</h2>
                  </div>
                  <p className="text-xs text-slate-400 mt-0.5">Manually record slip test marks and calculate total scores</p>
                </div>
                <button onClick={()=>setShowSlipModal(true)}
                  className="px-4 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-600/30 hover:scale-[1.02] transition-all">
                  + Add Manual Slip Test Mark
                </button>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                <div className="bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800">
                  <p className="text-[10px] font-bold text-slate-400 uppercase">Total Tests</p>
                  <p className="text-2xl font-extrabold text-white mt-1">{slipTests.length}</p>
                </div>
                <div className="bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800">
                  <p className="text-[10px] font-bold text-slate-400 uppercase">Marks Obtained</p>
                  <p className="text-2xl font-extrabold text-emerald-400 mt-1">{slipOb}</p>
                </div>
                <div className="bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800">
                  <p className="text-[10px] font-bold text-slate-400 uppercase">Total Max Marks</p>
                  <p className="text-2xl font-extrabold text-slate-300 mt-1">{slipMx}</p>
                </div>
                <div className="bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800">
                  <p className="text-[10px] font-bold text-slate-400 uppercase">Total Percentage</p>
                  <p className="text-2xl font-extrabold text-amber-400 mt-1">{slipPct}%</p>
                </div>
              </div>
            </div>

            {/* 5 Subjects Summary */}
            <div className="glass rounded-3xl p-6">
              <h2 className="text-lg font-bold text-white mb-4">📘 Class 10 Subjects (5 Subjects Only)</h2>
              <div className="space-y-3">
                {STD_10_SUBJECTS.map((subj, idx)=>{
                  const mySubjectMarks = marks.filter(m=>m.subject===subj);
                  const ob = mySubjectMarks.reduce((a,m)=>a+m.marksObtained,0);
                  const mx = mySubjectMarks.reduce((a,m)=>a+m.maxMarks,0);
                  const pct = mx ? Math.round(ob/mx*100) : 0;
                  const g = gradeInfo(pct);
                  return(
                    <div key={subj} className="bg-slate-900/70 p-4 rounded-2xl border border-slate-800 flex items-center justify-between gap-3">
                      <div className="flex items-center gap-3">
                        <span className="w-7 h-7 rounded-lg bg-blue-600/30 text-blue-300 font-extrabold text-xs flex items-center justify-center">{idx+1}</span>
                        <span className="font-bold text-white text-base">{subj}</span>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="font-extrabold text-white text-sm">{pct}%</span>
                        <span className={`px-2.5 py-0.5 rounded-lg text-xs font-bold border ${g.badge}`}>{g.label}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        {/* SLIP TESTS TAB */}
        {tab==='sliptests'&&(
          <div className="space-y-5 slide-up">
            <div className="glass rounded-3xl p-6">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
                <div>
                  <h2 className="text-xl font-bold text-white">📝 Manual Slip Test Records</h2>
                  <p className="text-xs text-slate-400">Total Score: <strong className="text-emerald-400">{slipOb} / {slipMx}</strong> ({slipPct}%)</p>
                </div>
                <button onClick={()=>setShowSlipModal(true)}
                  className="px-4 py-2 bg-emerald-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-600/30">
                  + Add Slip Test Mark
                </button>
              </div>

              {slipTests.length===0 ? (
                <p className="text-center text-slate-500 py-8 text-xs">No slip test marks added yet. Click "+ Add Slip Test Mark" above.</p>
              ) : (
                <div className="overflow-x-auto rounded-2xl border border-slate-800">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-900/80 text-[10px] uppercase text-slate-400 font-bold">
                      <tr>
                        <th className="py-3 px-4">Test Name</th>
                        <th className="py-3 px-4">Subject</th>
                        <th className="py-3 px-4 text-center">Marks Obtained</th>
                        <th className="py-3 px-4 text-center">Max Marks</th>
                        <th className="py-3 px-4 text-center">%</th>
                        <th className="py-3 px-4 text-center">Date</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60">
                      {slipTests.map(st=>{
                        const p = Math.round(st.marksObtained / st.maxMarks * 100);
                        return(
                          <tr key={st.id} className="hover:bg-slate-800/30">
                            <td className="py-3 px-4 font-bold text-white">{st.testName}</td>
                            <td className="py-3 px-4 font-semibold text-blue-300">{st.subject}</td>
                            <td className="py-3 px-4 text-center font-extrabold text-emerald-400">{st.marksObtained}</td>
                            <td className="py-3 px-4 text-center text-slate-400">{st.maxMarks}</td>
                            <td className="py-3 px-4 text-center font-bold text-white">{p}%</td>
                            <td className="py-3 px-4 text-center font-mono text-slate-400">{st.date}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </div>
        )}

        {/* EXAM MARKS TAB WITH ONLY PUBLISHED EXAMS */}
        {tab==='marks'&&(
          <div className="space-y-5 slide-up">
            <div className="glass rounded-3xl p-6">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-5">
                <div>
                  <h2 className="text-xl font-bold text-white">📊 Class 10 Exam Marks</h2>
                  <p className="text-xs text-slate-400">Published Exams: <strong className="text-emerald-400">{publishedExams.filter(e=>e!=='All').join(', ')}</strong></p>
                </div>
                <div className="flex flex-wrap gap-1 bg-slate-900/90 p-1.5 rounded-xl border border-slate-800">
                  {publishedExams.map(e=>(
                    <button key={e} onClick={()=>setExamFilter(e)}
                      className={`px-2.5 py-1 text-[11px] font-bold rounded-lg transition-all ${examFilter===e?'bg-blue-600 text-white shadow-md shadow-blue-600/30':'text-slate-400 hover:text-white'}`}>
                      {e}
                    </button>
                  ))}
                </div>
              </div>

              {filteredMarks.length===0 ? (
                <p className="text-center text-slate-500 py-8 text-xs">No published exam marks found for this filter.</p>
              ) : (
                <div className="overflow-x-auto rounded-2xl border border-slate-800">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-900/80 text-[10px] uppercase text-slate-400 font-bold">
                      <tr>
                        <th className="py-3 px-4">#</th>
                        <th className="py-3 px-4">Subject</th>
                        <th className="py-3 px-4">Exam Type</th>
                        <th className="py-3 px-4 text-center">Marks Obtained</th>
                        <th className="py-3 px-4 text-center">Max Marks</th>
                        <th className="py-3 px-4 text-center">%</th>
                        <th className="py-3 px-4 text-center">Grade</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60">
                      {filteredMarks.map((m,i)=>{
                        const p=Math.round(m.marksObtained/m.maxMarks*100);
                        const g=gradeInfo(p);
                        const sNo = STD_10_SUBJECTS.indexOf(m.subject) + 1;
                        return(
                          <tr key={i} className="hover:bg-slate-800/30">
                            <td className="py-3 px-4 font-bold text-blue-400">{sNo > 0 ? sNo : '-'}</td>
                            <td className="py-3 px-4 font-bold text-white">{m.subject}</td>
                            <td className="py-3 px-4">
                              <span className="px-2 py-0.5 rounded-md font-bold text-[10px] bg-blue-600/20 text-blue-300 border border-blue-500/30">
                                {m.examType}
                              </span>
                            </td>
                            <td className="py-3 px-4 text-center font-extrabold text-white">{m.marksObtained}</td>
                            <td className="py-3 px-4 text-center text-slate-400">{m.maxMarks}</td>
                            <td className="py-3 px-4 text-center font-bold text-white">{p}%</td>
                            <td className="py-3 px-4 text-center"><span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${g.badge}`}>{g.label}</span></td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </div>
        )}

        {/* NOTICES TAB */}
        {tab==='notices'&&(
          <div className="space-y-4 slide-up">
            <div className="glass rounded-3xl p-6">
              <h2 className="text-xl font-bold text-white mb-4">🔔 Class 10 Notices (3 Categories)</h2>
              <div className="space-y-3">
                {notices.map(n=>(
                  <div key={n.id} className="p-4 rounded-2xl bg-slate-900/80 border border-slate-800">
                    <div className="flex items-center justify-between mb-1">
                      <div className="flex items-center gap-2">
                        <span className="text-lg">{n.icon}</span>
                        <span className="text-xs font-bold text-blue-400 uppercase">{n.category}</span>
                      </div>
                      <span className="text-[10px] font-mono text-slate-500">{n.date}</span>
                    </div>
                    <p className="font-bold text-white text-sm mt-1">{n.title}</p>
                    <p className="text-xs text-slate-300 mt-1">{n.description}</p>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

      </main>

      {/* Manual Slip Test Modal */}
      {showSlipModal&&(
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
          <div className="glass rounded-3xl w-full max-w-md p-6 border border-emerald-500/40 shadow-2xl">
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-lg font-bold text-white flex items-center gap-2">📝 Add Slip Test Mark</h3>
              <button onClick={()=>setShowSlipModal(false)} className="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <form onSubmit={handleAddSlipTest} className="space-y-3.5">
              <div>
                <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">Subject</label>
                <select value={slipForm.subject} onChange={e=>setSlipForm({...slipForm, subject:e.target.value})}
                  className="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:ring-2 focus:ring-emerald-500">
                  {STD_10_SUBJECTS.map(s=><option key={s}>{s}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">Test Name</label>
                <input type="text" value={slipForm.testName} onChange={e=>setSlipForm({...slipForm, testName:e.target.value})} required
                  placeholder="e.g. Slip Test 1" className="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white"/>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">Marks Obtained</label>
                  <input type="number" step="0.5" value={slipForm.marksObtained} onChange={e=>setSlipForm({...slipForm, marksObtained:e.target.value})} required
                    placeholder="e.g. 23" className="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white"/>
                </div>
                <div>
                  <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">Max Marks</label>
                  <input type="number" value={slipForm.maxMarks} onChange={e=>setSlipForm({...slipForm, maxMarks:e.target.value})} required
                    placeholder="e.g. 25" className="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white"/>
                </div>
              </div>

              <div>
                <label className="block text-[11px] font-bold text-slate-400 uppercase mb-1">Date</label>
                <input type="date" value={slipForm.date} onChange={e=>setSlipForm({...slipForm, date:e.target.value})} required
                  className="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white"/>
              </div>

              <div className="flex gap-2 pt-2">
                <button type="button" onClick={()=>setShowSlipModal(false)} className="flex-1 py-2.5 bg-slate-800 text-slate-300 text-xs font-bold rounded-xl">Cancel</button>
                <button type="submit" className="flex-1 py-2.5 bg-emerald-600 text-white text-xs font-bold rounded-xl shadow-lg shadow-emerald-600/30">Save Test Mark</button>
              </div>
            </form>
          </div>
        </div>
      )}

      <footer className="py-3 border-t border-slate-800 text-center text-xs text-slate-500">
        S. D. Sion Matric. Hr. Sec. School · Standard 10 Portal
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
