<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>S. D. Sion Matriculation | Standard 12 Student Portal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📕</text></svg>"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{font-family:'Plus Jakarta Sans',sans-serif}
    body{background:#08061a}
    .glass{background:rgba(20,15,38,.8);backdrop-filter:blur(24px);border:1px solid rgba(168,85,247,.15)}
    .glass-dark{background:rgba(8,6,26,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(168,85,247,.1)}
    .school-banner{background:linear-gradient(135deg,#130a28 0%,#200f44 40%,#130a28 100%);border-bottom:3px solid #7c3aed}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:rgba(8,6,26,.6)}
    ::-webkit-scrollbar-thumb{background:rgba(168,85,247,.3);border-radius:99px}
    @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .slide-up{animation:slideUp .35s ease forwards}
  </style>
</head>
<body class="min-h-screen text-white flex flex-col">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

// ─── CLASS 12 GROUPS & SUBJECT ORDERING (6 SUBJECTS PER GROUP) ─────

  "Commerce":         ["Tamil", "English", "Commerce", "Accountancy", "Economics", "Computer Applications"]

  { studentId:"STU-1004", name:"Emily Davis",     group:"Bio-Maths",        section:"B", gmail:"emily.davis@gmail.com",      rollNo:"12-B-04", attendance:76.5, avatarUrl:"https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200&q=80" },
  { studentId:"STU-1005", name:"Liam Wilson",     group:"Computer Science", section:"A", gmail:"liam.wilson@gmail.com",      rollNo:"12-A-05", attendance:92.0, avatarUrl:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&q=80" },
  { studentId:"STU-1008", name:"Ananya Rao",      group:"Commerce",         section:"C", gmail:"ananya.rao@gmail.com",       rollNo:"12-C-08", attendance:96.0, avatarUrl:"https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=200&q=80" },

const DEFAULT_MARKS = [
  // Marcus Vance STU-1003 (Computer Science Group)
  {studentId:"STU-1003",group:"Computer Science",subject:"Tamil",           examType:"Mid-Term",marksObtained:85, maxMarks:100,date:"2026-07-10"},
  {studentId:"STU-1003",group:"Computer Science",subject:"English",         examType:"Mid-Term",marksObtained:80, maxMarks:100,date:"2026-07-12"},
  {studentId:"STU-1003",group:"Computer Science",subject:"Mathematics",    examType:"Mid-Term",marksObtained:88, maxMarks:100,date:"2026-07-14"},
  {studentId:"STU-1003",group:"Computer Science",subject:"Physics",         examType:"Mid-Term",marksObtained:82, maxMarks:100,date:"2026-07-16"},
  {studentId:"STU-1003",group:"Computer Science",subject:"Chemistry",       examType:"Mid-Term",marksObtained:79, maxMarks:100,date:"2026-07-18"},
  {studentId:"STU-1003",group:"Computer Science",subject:"Computer Science",examType:"Mid-Term",marksObtained:94, maxMarks:100,date:"2026-07-20"},

  // Emily Davis STU-1004 (Bio-Maths Group)
  {studentId:"STU-1004",group:"Bio-Maths",subject:"Tamil",                  examType:"Mid-Term",marksObtained:82, maxMarks:100,date:"2026-07-10"},
  {studentId:"STU-1004",group:"Bio-Maths",subject:"English",                examType:"Mid-Term",marksObtained:74, maxMarks:100,date:"2026-07-12"},
  {studentId:"STU-1004",group:"Bio-Maths",subject:"Mathematics",           examType:"Mid-Term",marksObtained:62, maxMarks:100,date:"2026-07-14"},
  {studentId:"STU-1004",group:"Bio-Maths",subject:"Physics",                examType:"Mid-Term",marksObtained:65, maxMarks:100,date:"2026-07-16"},
  {studentId:"STU-1004",group:"Bio-Maths",subject:"Chemistry",              examType:"Mid-Term",marksObtained:70, maxMarks:100,date:"2026-07-18"},
  {studentId:"STU-1004",group:"Bio-Maths",subject:"Biology",                examType:"Mid-Term",marksObtained:78, maxMarks:100,date:"2026-07-20"},

  // Liam Wilson STU-1005 (Computer Science Group)
  {studentId:"STU-1005",group:"Computer Science",subject:"Tamil",           examType:"Mid-Term",marksObtained:90, maxMarks:100,date:"2026-07-10"},
  {studentId:"STU-1005",group:"Computer Science",subject:"English",         examType:"Mid-Term",marksObtained:84, maxMarks:100,date:"2026-07-12"},
  {studentId:"STU-1005",group:"Computer Science",subject:"Mathematics",    examType:"Mid-Term",marksObtained:93, maxMarks:100,date:"2026-07-14"},
  {studentId:"STU-1005",group:"Computer Science",subject:"Physics",         examType:"Mid-Term",marksObtained:91, maxMarks:100,date:"2026-07-16"},
  {studentId:"STU-1005",group:"Computer Science",subject:"Chemistry",       examType:"Mid-Term",marksObtained:87, maxMarks:100,date:"2026-07-18"},
  {studentId:"STU-1005",group:"Computer Science",subject:"Computer Science",examType:"Mid-Term",marksObtained:96, maxMarks:100,date:"2026-07-20"},

  // Ananya Rao STU-1008 (Commerce Group)
  {studentId:"STU-1008",group:"Commerce",subject:"Tamil",                   examType:"Mid-Term",marksObtained:94, maxMarks:100,date:"2026-07-10"},
  {studentId:"STU-1008",group:"Commerce",subject:"English",                 examType:"Mid-Term",marksObtained:93, maxMarks:100,date:"2026-07-12"},
  {studentId:"STU-1008",group:"Commerce",subject:"Commerce",                examType:"Mid-Term",marksObtained:98, maxMarks:100,date:"2026-07-14"},
  {studentId:"STU-1008",group:"Commerce",subject:"Accountancy",             examType:"Mid-Term",marksObtained:97, maxMarks:100,date:"2026-07-16"},
  {studentId:"STU-1008",group:"Commerce",subject:"Economics",               examType:"Mid-Term",marksObtained:95, maxMarks:100,date:"2026-07-18"},
  {studentId:"STU-1008",group:"Commerce",subject:"Computer Applications",   examType:"Mid-Term",marksObtained:99, maxMarks:100,date:"2026-07-20"},
];

// ─── STRICTLY 3 NOTICES (JUST LIKE 10TH STANDARD) ─────────────────
const DEFAULT_NOTICES = [
  {
    id: "NTC12-01",
    category: "Remarks",
    icon: "📝",
    title: "Teacher's Academic & Higher Secondary Remarks",
    date: "2026-07-30",
    priority: "High",
    description: "Strong performance in core group subjects. Continue practicing Tamil essay writing and time management for HSC board examination."
  },
  {
    id: "NTC12-02",
    category: "Upcoming Events",
    icon: "📅",
    title: "Career Counseling & Entrance Seminar 2026",
    date: "2026-08-08",
    priority: "Urgent",
    description: "Orientation session on TNEA Engineering, NEET Medical, and CA Commerce admissions in main auditorium for Class 12 students."
  },
  {
    id: "NTC12-03",
    category: "Others",
    icon: "📌",
    title: "Practical Examinations & Special Class Schedule",
    date: "2026-07-28",
    priority: "General",
    description: "Science laboratories and Computer labs will remain open until 7:30 PM for Class 12 practical record work and revision."
  }
];

function seedData(){
  localStorage.setItem('ap_students_v12', JSON.stringify(DEFAULT_STUDENTS));
  localStorage.setItem('ap_marks_v12', JSON.stringify(DEFAULT_MARKS));
  localStorage.setItem('ap_notices_v12', JSON.stringify(DEFAULT_NOTICES));
}

const gradeInfo = pct => {
  if(pct>=90)return{label:'A+',badge:'text-emerald-400 bg-emerald-500/15 border-emerald-500/30',bar:'bg-gradient-to-r from-emerald-500 to-teal-400'};
  if(pct>=80)return{label:'A', badge:'text-purple-400 bg-purple-500/15 border-purple-500/30',bar:'bg-gradient-to-r from-purple-500 to-pink-400'};
  if(pct>=70)return{label:'B', badge:'text-indigo-400 bg-indigo-500/15 border-indigo-500/30',bar:'bg-gradient-to-r from-indigo-500 to-purple-400'};
  if(pct>=60)return{label:'C', badge:'text-amber-400 bg-amber-500/15 border-amber-500/30',bar:'bg-gradient-to-r from-amber-500 to-yellow-400'};
  return        {label:'F', badge:'text-rose-400 bg-rose-500/15 border-rose-500/30',bar:'bg-gradient-to-r from-rose-600 to-rose-400'};
};

function App(){
  const [student, setStudent]=useState(null);
  const [marks, setMarks]=useState([]);
  const [notices, setNotices]=useState([]);
  const [tab, setTab]=useState('dashboard');
  const [examFilter, setExamFilter]=useState('All');

  useEffect(()=>{
    seedData();
    let currentId=localStorage.getItem('ap_current_student');
    const students=JSON.parse(localStorage.getItem('ap_students_v12')||'[]');
    let found=students.find(s=>s.studentId===currentId);
    
    if(!found){
      found = students[0];
      localStorage.setItem('ap_current_student', found.studentId);
    }

    setStudent(found);
    const allMarks=JSON.parse(localStorage.getItem('ap_marks_v12')||'[]');
    setMarks(allMarks.filter(m=>m.studentId===found.studentId));
    setNotices(JSON.parse(localStorage.getItem('ap_notices_v12')||'[]'));
  },[]);

  if(!student) return null;

  const groupSubjects = GROUP_SUBJECTS[student.group] || GROUP_SUBJECTS["Bio-Maths"];
  const exams=['All',...new Set(marks.map(m=>m.examType))];
  const filteredMarks=examFilter==='All'?marks:marks.filter(m=>m.examType===examFilter);

  // Group marks by exact 6 subjects in order
  const subjectMap={};
  groupSubjects.forEach(s=>{ subjectMap[s] = {ob:0, mx:0, records:[]}; });

  filteredMarks.forEach(m=>{
    if(subjectMap[m.subject]){
      subjectMap[m.subject].ob+=m.marksObtained;
      subjectMap[m.subject].mx+=m.maxMarks;
      subjectMap[m.subject].records.push(m);
    }
  });

  const totalOb=marks.reduce((a,m)=>a+m.marksObtained,0);
  const totalMx=marks.reduce((a,m)=>a+m.maxMarks,0);
  const overall=totalMx?Math.round(totalOb/totalMx*100):0;

  // Cut-off calculation for Bio-Maths / CS
  const mathAvg = subjectMap['Mathematics'] ? Math.round(subjectMap['Mathematics'].ob/subjectMap['Mathematics'].mx*100) : 0;
  const phyAvg  = subjectMap['Physics']     ? Math.round(subjectMap['Physics'].ob/subjectMap['Physics'].mx*100)     : 0;
  const chemAvg = subjectMap['Chemistry']   ? Math.round(subjectMap['Chemistry'].ob/subjectMap['Chemistry'].mx*100) : 0;
  const cutoff  = Math.round((mathAvg + (phyAvg/2) + (chemAvg/2)) * 10) / 10;

  return(
    <div className="min-h-screen flex flex-col">
      {/* Banner */}
      <div className="school-banner py-4 px-4 text-center relative overflow-hidden bg-slate-900/90">
        <div className="max-w-4xl mx-auto flex flex-col items-center justify-center">
          <div className="bg-white rounded-2xl p-2.5 shadow-xl border border-white/20 inline-block max-w-full">
            <img src="school_logo.png" alt="S. D. Sion Matriculation" className="h-14 max-w-full object-contain mx-auto" onError={e=>{e.target.src='school_logo.jpg';}}/>
          </div>
          <p className="text-[11px] tracking-widest text-purple-300 uppercase font-bold mt-2">Standard 12 Senior Secondary Portal</p>
        </div>
      </div>

      {/* Nav */}
      <header className="sticky top-0 z-40 glass-dark">
        <div className="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <span className="px-2.5 py-1 text-xs font-black bg-purple-600/30 text-purple-300 border border-purple-500/40 rounded-full">📕 Std 12</span>
            <span className="text-xs font-bold text-white hidden sm:inline">{student.name}</span>
          </div>

          <nav className="flex gap-1">
            {[['dashboard','🏠 Dashboard'],['marks','📊 6 Subjects Marks'],['cutoff','🎯 Cut-off Tracker'],['notices','🔔 Notices (3)']].map(([id,label])=>(
              <button key={id} onClick={()=>setTab(id)}
                className={`px-3.5 py-1.5 text-xs font-bold rounded-lg transition-all ${tab===id?'bg-purple-600 text-white shadow-md shadow-purple-600/30':'text-slate-400 hover:text-white'}`}>{label}</button>
            ))}
          </nav>

          <a href="index.html" className="text-xs text-rose-400 hover:text-rose-300 font-bold border border-rose-500/20 px-2.5 py-1 rounded-lg">Sign Out 🚪</a>
        </div>
      </header>

      {/* Main Content */}
      <main className="flex-1 max-w-5xl w-full mx-auto px-4 py-6">

        {tab==='dashboard'&&(
          <div className="space-y-6 slide-up">
            {/* Student Banner */}
            <div className="glass rounded-3xl p-6 relative overflow-hidden border-l-4 border-purple-500">
              <div className="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                <img src={student.avatarUrl} alt="" className="w-16 h-16 rounded-2xl object-cover ring-4 ring-purple-500/30"/>
                <div className="flex-1">
                  <div className="flex items-center gap-2">
                    <h1 className="text-2xl font-extrabold text-white">{student.name}</h1>
                    <span className="px-3 py-1 text-xs font-extrabold bg-purple-500/20 text-purple-300 border border-purple-500/30 rounded-full">
                      Group: {student.group}
                    </span>
                  </div>
                  <p className="text-xs text-slate-400 mt-1">Roll No: <strong className="text-white">{student.rollNo}</strong> · Gmail: <strong className="text-white">{student.gmail}</strong></p>
                </div>
                <div className="bg-purple-600/20 border border-purple-500/40 rounded-2xl px-5 py-3 text-center">
                  <p className="text-2xl font-extrabold text-white">{overall}%</p>
                  <p className="text-[10px] font-bold text-purple-300 uppercase">Class 12 Average</p>
                </div>
              </div>
            </div>

            {/* Exact 6 Subjects Performance */}
            <div className="glass rounded-3xl p-6">
              <h2 className="text-lg font-bold text-white mb-4 flex items-center justify-between">
                <span>📕 Class 12 Subjects ({student.group} Group — 6 Subjects)</span>
                <span className="text-xs text-purple-300 font-mono">1. Tamil · 2. English · 3. {groupSubjects[2]} · 4. {groupSubjects[3]} · 5. {groupSubjects[4]} · 6. {groupSubjects[5]}</span>
              </h2>
              <div className="space-y-4">
                {groupSubjects.map((subj, idx)=>{
                  const d=subjectMap[subj] || {ob:0, mx:0};
                  const pct=d.mx?Math.round(d.ob/d.mx*100):0;
                  const g=gradeInfo(pct);
                  return(
                    <div key={subj} className="bg-slate-900/70 p-4 rounded-2xl border border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div className="flex items-center gap-3">
                        <div className="w-8 h-8 rounded-xl bg-purple-600/20 border border-purple-500/40 flex items-center justify-center font-extrabold text-purple-300 text-xs">
                          {idx+1}
                        </div>
                        <div>
                          <p className="font-extrabold text-white text-base">{subj}</p>
                          <p className="text-[11px] text-slate-400">{student.group} Group Subject</p>
                        </div>
                      </div>

                      <div className="flex items-center gap-4 flex-1 max-w-md">
                        <div className="flex-1">
                          <div className="h-2.5 bg-slate-950 rounded-full overflow-hidden border border-slate-800">
                            <div className={`h-full rounded-full ${g.bar}`} style={{width:`${pct}%`}}/>
                          </div>
                        </div>
                        <span className="font-extrabold text-white text-sm w-12 text-right">{pct}%</span>
                        <span className={`px-2.5 py-0.5 rounded-lg text-xs font-extrabold border ${g.badge}`}>{g.label}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Notice Preview */}
            <div className="glass rounded-3xl p-6">
              <h2 className="text-lg font-bold text-white mb-4">🔔 Notice Board (3 Categories)</h2>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {notices.map(n=>(
                  <div key={n.id} className="bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
                    <div className="flex items-center gap-2 mb-2">
                      <span className="text-xl">{n.icon}</span>
                      <span className="text-xs font-bold text-purple-300 uppercase">{n.category}</span>
                    </div>
                    <p className="font-bold text-white text-xs mb-1">{n.title}</p>
                    <p className="text-[11px] text-slate-400 leading-relaxed">{n.description}</p>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* ══ 6 SUBJECTS MARKS TAB ══ */}
        {tab==='marks'&&(
          <div className="space-y-5 slide-up">
            <div className="glass rounded-3xl p-6">
              <div className="flex items-center justify-between mb-5">
                <div>
                  <h2 className="text-xl font-bold text-white">📊 Class 12 Marks Breakdown</h2>
                  <p className="text-xs text-purple-300 mt-0.5">Group: {student.group} (6 Subjects in Order)</p>
                </div>
                <div className="flex gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800">
                  {exams.map(e=>(
                    <button key={e} onClick={()=>setExamFilter(e)}
                      className={`px-3 py-1 text-xs font-bold rounded-lg transition-all ${examFilter===e?'bg-purple-600 text-white':'text-slate-400 hover:text-white'}`}>{e}</button>
                  ))}
                </div>
              </div>

              <div className="overflow-x-auto rounded-2xl border border-slate-800">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-900/80 text-[10px] uppercase text-slate-400 font-bold">
                    <tr>
                      <th className="py-3 px-4">#</th>
                      <th className="py-3 px-4">Subject</th>
                      <th className="py-3 px-4">Exam Type</th>
                      <th className="py-3 px-4 text-center">Marks Obtained</th>
                      <th className="py-3 px-4 text-center">Max Marks</th>
                      <th className="py-3 px-4 text-center">%</th>
                      <th className="py-3 px-4 text-center">Grade</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60">
                    {filteredMarks.map((m,i)=>{
                      const pct=Math.round(m.marksObtained/m.maxMarks*100);
                      const g=gradeInfo(pct);
                      const sNo = groupSubjects.indexOf(m.subject) + 1;
                      return(
                        <tr key={i} className="hover:bg-slate-800/30">
                          <td className="py-3 px-4 font-bold text-purple-400">{sNo > 0 ? sNo : '-'}</td>
                          <td className="py-3 px-4 font-bold text-white">{m.subject}</td>
                          <td className="py-3 px-4 text-slate-300">{m.examType}</td>
                          <td className="py-3 px-4 text-center font-extrabold text-white">{m.marksObtained}</td>
                          <td className="py-3 px-4 text-center text-slate-400">{m.maxMarks}</td>
                          <td className="py-3 px-4 text-center font-bold text-white">{pct}%</td>
                          <td className="py-3 px-4 text-center"><span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${g.badge}`}>{g.label}</span></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        )}

        {/* ══ CUTOFF TRACKER ══ */}
        {tab==='cutoff'&&(
          <div className="space-y-5 slide-up">
            <div className="glass rounded-3xl p-6 sm:p-8">
              <h2 className="text-xl font-bold text-white mb-2">🎯 Higher Secondary Engineering Cut-off Tracker</h2>
              <p className="text-xs text-slate-400 mb-6">TNEA Engineering Cut-off Formula: Maths + (Physics ÷ 2) + (Chemistry ÷ 2)</p>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div className="bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
                  <p className="text-xs font-bold text-slate-400 uppercase">Mathematics</p>
                  <p className="text-2xl font-extrabold text-white mt-1">{mathAvg} / 100</p>
                  <p className="text-[10px] text-purple-400 mt-1">Full 100 Marks</p>
                </div>
                <div className="bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
                  <p className="text-xs font-bold text-slate-400 uppercase">Physics (÷ 2)</p>
                  <p className="text-2xl font-extrabold text-white mt-1">{phyAvg} / 100 <span className="text-xs text-purple-300">({phyAvg/2})</span></p>
                  <p className="text-[10px] text-purple-400 mt-1">50 Marks Weightage</p>
                </div>
                <div className="bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
                  <p className="text-xs font-bold text-slate-400 uppercase">Chemistry (÷ 2)</p>
                  <p className="text-2xl font-extrabold text-white mt-1">{chemAvg} / 100 <span className="text-xs text-purple-300">({chemAvg/2})</span></p>
                  <p className="text-[10px] text-purple-400 mt-1">50 Marks Weightage</p>
                </div>
              </div>

              <div className="bg-gradient-to-r from-purple-600/30 to-pink-600/30 border border-purple-500/40 rounded-2xl p-6 text-center">
                <p className="text-xs font-extrabold text-purple-300 uppercase tracking-widest">TNEA Engineering Cut-off Score</p>
                <p className="text-5xl font-black text-amber-300 mt-2">{cutoff}</p>
                <p className="text-xs text-slate-300 mt-2">Maximum possible: 200.0</p>
              </div>
            </div>
          </div>
        )}

        {/* ══ EXACTLY 3 NOTICES TAB ══ */}
        {tab==='notices'&&(
          <div className="space-y-4 slide-up">
            <div className="glass rounded-3xl p-6">
              <h2 className="text-xl font-bold text-white mb-2">🔔 Standard 12 Notices &amp; Communications</h2>
              <p className="text-xs text-slate-400 mb-6">3 Categories: 1. Remarks · 2. Upcoming Events · 3. Others</p>
              
              <div className="space-y-4">
                {notices.map((n, idx)=>(
                  <div key={n.id} className="p-5 rounded-2xl bg-slate-900/80 border border-slate-800 hover:border-purple-500/40 transition-all">
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-2">
                        <span className="w-6 h-6 rounded-lg bg-purple-600/30 border border-purple-500/40 flex items-center justify-center text-xs font-bold text-purple-300">{idx+1}</span>
                        <span className="text-lg">{n.icon}</span>
                        <span className="text-xs font-extrabold text-purple-400 uppercase tracking-wider">{n.category}</span>
                      </div>
                      <span className="text-[10px] font-mono text-slate-400">{n.date}</span>
                    </div>
                    <h3 className="font-extrabold text-white text-base mb-1">{n.title}</h3>
                    <p className="text-xs text-slate-300 leading-relaxed bg-slate-950/60 p-3 rounded-xl border border-slate-800/80">{n.description}</p>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

      </main>

      <footer className="border-t border-slate-800 py-3 text-center text-xs text-slate-500">
        S. D. Sion Matric. Hr. Sec. School · Standard 12 Portal ({student.group} Group)
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
