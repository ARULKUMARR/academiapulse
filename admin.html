<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Control Hub | S. D. Sion Matriculation</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    *{font-family:'Plus Jakarta Sans',sans-serif}
    body{
      background:#080718;
      background-image: 
        radial-gradient(at 0% 0%, rgba(245,158,11,0.22) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(124,58,237,0.18) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(16,185,129,0.15) 0px, transparent 50%);
      background-attachment:fixed;
    }
    .glass{background:rgba(15,23,42,.85);backdrop-filter:blur(24px);border:1px solid rgba(245,158,11,.2)}
    .glass-dark{background:rgba(6,9,26,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(245,158,11,.2)}
    .school-banner{background:linear-gradient(135deg,#0a1628 0%,#0f2044 40%,#0a1628 100%);border-bottom:3px solid #b8860b}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:rgba(6,9,26,.6)}
    ::-webkit-scrollbar-thumb{background:rgba(245,158,11,.4);border-radius:99px}
    @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .slide-up{animation:slideUp .35s ease forwards}
  </style>
</head>
<body class="min-h-screen text-white flex flex-col">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const ALL_EXAMS = ["1st Midterm", "Quarterly Exam", "2nd Midterm", "Half Yearly Exam", "3rd Midterm", "Annual Exam"];

const DEFAULT_VISIBILITY = {
  std10: { "1st Midterm": true, "Quarterly Exam": false, "2nd Midterm": false, "Half Yearly Exam": false, "3rd Midterm": false, "Annual Exam": false },
  std12: { "1st Midterm": true, "Quarterly Exam": false, "2nd Midterm": false, "Half Yearly Exam": false, "3rd Midterm": false, "Annual Exam": false }
};

function seedData(){
  if(!localStorage.getItem('ap_exam_visibility')){
    localStorage.setItem('ap_exam_visibility', JSON.stringify(DEFAULT_VISIBILITY));
  }
}

function App(){
  const [activeTab, setActiveTab]=useState('visibility');
  const [visibility, setVisibility]=useState(DEFAULT_VISIBILITY);
  const [selectedStd, setSelectedStd]=useState('10');
  const [students10, setStudents10]=useState([]);
  const [students12, setStudents12]=useState([]);
  const [uploadStatus, setUploadStatus]=useState('');
  const [savedNotice, setSavedNotice]=useState(false);

  useEffect(()=>{
    seedData();
    const auth=localStorage.getItem('ap_auth');
    if(auth!=='admin'){ window.location.href='admin-login.html'; return; }

    const vis = JSON.parse(localStorage.getItem('ap_exam_visibility') || JSON.stringify(DEFAULT_VISIBILITY));
    setVisibility(vis);

    setStudents10(JSON.parse(localStorage.getItem('ap_students_v10')||'[]'));
    setStudents12(JSON.parse(localStorage.getItem('ap_students_v12')||'[]'));
  },[]);

  const toggleExamVisibility = (stdKey, examName) => {
    const updated = {
      ...visibility,
      [stdKey]: {
        ...visibility[stdKey],
        [examName]: !visibility[stdKey][examName]
      }
    };
    setVisibility(updated);
    localStorage.setItem('ap_exam_visibility', JSON.stringify(updated));
    
    setSavedNotice(true);
    setTimeout(()=>setSavedNotice(false), 2000);
  };

  const handleFileUpload = (e, targetStd) => {
    const file = e.target.files[0];
    if(!file) return;

    setUploadStatus('Reading Excel file...');
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const bstr = evt.target.result;
        const wb = XLSX.read(bstr, { type: 'binary' });
        const wsname = wb.SheetNames[0];
        const ws = wb.Sheets[wsname];
        const data = XLSX.utils.sheet_to_json(ws);

        if(!data || data.length === 0) {
          setUploadStatus('❌ Error: Excel file appears empty.');
          return;
        }

        const key = targetStd === '10' ? 'ap_marks_v10' : 'ap_marks_v12';
        const existing = JSON.parse(localStorage.getItem(key) || '[]');
        
        let count = 0;
        data.forEach(row => {
          const studentId = row.Student_ID || row.studentId || 'STU-1001';
          const examType = row.Exam_Type || row.examType || '1st Midterm';

          // Extract subject marks
          Object.keys(row).forEach(colName => {
            if(!['Student_ID','Gmail','Student_Name','Exam_Type','studentId','examType'].includes(colName)){
              const markObtained = parseFloat(row[colName]);
              if(!isNaN(markObtained)){
                existing.unshift({
                  studentId: studentId,
                  standard: targetStd,
                  subject: colName,
                  examType: examType,
                  marksObtained: markObtained,
                  maxMarks: markObtained <= 50 ? 50 : 100,
                  date: new Date().toISOString().split('T')[0]
                });
                count++;
              }
            }
          });
        });

        localStorage.setItem(key, JSON.stringify(existing));
        setUploadStatus(`✅ Successfully imported ${count} mark entries for Standard ${targetStd}!`);
      } catch (err) {
        setUploadStatus(`❌ Import failed: ${err.message}`);
      }
    };
    reader.readAsBinaryString(file);
  };

  return(
    <div className="min-h-screen flex flex-col">
      {/* Banner */}
      <div className="school-banner py-5 px-4 text-center relative overflow-hidden">
        <div className="max-w-4xl mx-auto flex flex-col items-center justify-center">
          <div className="bg-white/95 rounded-2xl p-3 shadow-2xl border border-white/20 inline-block max-w-full">
            <img src="school_logo.png" alt="S. D. Sion Matriculation" className="h-16 max-w-full object-contain mx-auto" onError={e=>{e.target.src='school_logo.jpg';}}/>
          </div>
          <p className="text-xs tracking-widest text-amber-300 uppercase font-bold mt-2.5">Administrator &amp; Faculty Control Portal</p>
        </div>
      </div>

      {/* Header Nav */}
      <header className="sticky top-0 z-40 glass-dark">
        <div className="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <span className="px-2.5 py-1 text-xs font-black bg-amber-600/30 text-amber-300 border border-amber-500/40 rounded-full">🛡️ Admin Hub</span>
          </div>

          <nav className="flex gap-1">
            {[['visibility','👁️ Exam Visibility Toggle'],['excel','📊 Excel Import &amp; Templates'],['students','👥 Student Records']].map(([id,label])=>(
              <button key={id} onClick={()=>setActiveTab(id)}
                className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${activeTab===id?'bg-amber-600 text-white shadow-lg shadow-amber-600/30':'text-slate-400 hover:text-white'}`}>{label}</button>
            ))}
          </nav>

          <a href="admin-login.html" className="text-xs text-rose-400 hover:text-rose-300 font-bold border border-rose-500/20 px-2.5 py-1 rounded-lg">Sign Out 🚪</a>
        </div>
      </header>

      {/* Main Content */}
      <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6">

        {savedNotice&&(
          <div className="mb-4 p-3 bg-emerald-500/20 border border-emerald-500/40 rounded-xl text-xs text-emerald-300 font-bold text-center animate-bounce">
            ✅ Exam Visibility Settings Updated Live! Changes applied immediately to student portals.
          </div>
        )}

        {/* TAB 1: EXAM VISIBILITY MANAGER */}
        {activeTab==='visibility'&&(
          <div className="space-y-6 slide-up">
            <div className="glass rounded-3xl p-6 border-l-4 border-amber-500">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-2">
                <div>
                  <h1 className="text-2xl font-extrabold text-white flex items-center gap-2">
                    <span>👁️</span> Exam Visibility &amp; Publish Controls
                  </h1>
                  <p className="text-xs text-slate-400 mt-1">
                    Control which exam marks students can view. Currently only <strong>1st Midterm</strong> is enabled by default. Toggle upcoming exams to publish them when finished.
                  </p>
                </div>
              </div>
            </div>

            {/* Standard 10 Visibility Toggle */}
            <div className="glass rounded-3xl p-6 border border-blue-500/30">
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-2">
                  <span className="px-2.5 py-1 text-xs font-black bg-blue-600/30 text-blue-300 border border-blue-500/40 rounded-full">📘 Class 10</span>
                  <h2 className="text-lg font-bold text-white">Class 10 Exam Publishing Controls</h2>
                </div>
                <span className="text-[11px] font-bold text-slate-400">5 Subjects</span>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                {ALL_EXAMS.map(exam=>{
                  const isVisible = visibility.std10?.[exam] ?? false;
                  return(
                    <div key={exam} className={`p-4 rounded-2xl border transition-all flex items-center justify-between ${isVisible?'bg-blue-950/40 border-blue-500/50 shadow-lg shadow-blue-500/10':'bg-slate-900/60 border-slate-800'}`}>
                      <div>
                        <p className="font-bold text-white text-sm">{exam}</p>
                        <p className={`text-[10px] font-bold mt-0.5 ${isVisible?'text-emerald-400':'text-amber-400'}`}>
                          {isVisible ? '🟢 Published to Students' : '🔒 Hidden (Upcoming)'}
                        </p>
                      </div>

                      <button onClick={()=>toggleExamVisibility('std10', exam)}
                        className={`px-3 py-1.5 text-xs font-extrabold rounded-xl transition-all ${isVisible?'bg-rose-500/20 text-rose-300 border border-rose-500/40 hover:bg-rose-500/30':'bg-emerald-600 text-white shadow-md hover:scale-105'}`}>
                        {isVisible ? 'Hide Exam 🙈' : 'Publish Exam 👁️'}
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Standard 12 Visibility Toggle */}
            <div className="glass rounded-3xl p-6 border border-purple-500/30">
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-2">
                  <span className="px-2.5 py-1 text-xs font-black bg-purple-600/30 text-purple-300 border border-purple-500/40 rounded-full">📕 Class 12</span>
                  <h2 className="text-lg font-bold text-white">Class 12 Exam Publishing Controls</h2>
                </div>
                <span className="text-[11px] font-bold text-slate-400">6 Subjects</span>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                {ALL_EXAMS.map(exam=>{
                  const isVisible = visibility.std12?.[exam] ?? false;
                  return(
                    <div key={exam} className={`p-4 rounded-2xl border transition-all flex items-center justify-between ${isVisible?'bg-purple-950/40 border-purple-500/50 shadow-lg shadow-purple-500/10':'bg-slate-900/60 border-slate-800'}`}>
                      <div>
                        <p className="font-bold text-white text-sm">{exam}</p>
                        <p className={`text-[10px] font-bold mt-0.5 ${isVisible?'text-emerald-400':'text-amber-400'}`}>
                          {isVisible ? '🟢 Published to Students' : '🔒 Hidden (Upcoming)'}
                        </p>
                      </div>

                      <button onClick={()=>toggleExamVisibility('std12', exam)}
                        className={`px-3 py-1.5 text-xs font-extrabold rounded-xl transition-all ${isVisible?'bg-rose-500/20 text-rose-300 border border-rose-500/40 hover:bg-rose-500/30':'bg-emerald-600 text-white shadow-md hover:scale-105'}`}>
                        {isVisible ? 'Hide Exam 🙈' : 'Publish Exam 👁️'}
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>

          </div>
        )}

        {/* TAB 2: EXCEL IMPORT & TEMPLATES */}
        {activeTab==='excel'&&(
          <div className="space-y-6 slide-up">
            <div className="glass rounded-3xl p-6 border-l-4 border-emerald-500">
              <h2 className="text-xl font-bold text-white mb-2">📊 Excel Templates &amp; Mark Sheet Upload</h2>
              <p className="text-xs text-slate-400">
                Download the official pre-formatted Excel mark sheet templates below for Class 10 and Class 12, fill in student marks, and upload.
              </p>
            </div>

            {/* Template Download Section */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              
              {/* Class 10 Template Box */}
              <div className="glass rounded-3xl p-6 border border-blue-500/30 flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between mb-3">
                    <span className="px-2.5 py-1 text-xs font-black bg-blue-600/30 text-blue-300 border border-blue-500/40 rounded-full">📘 Class 10 Template</span>
                    <span className="text-[10px] font-bold text-slate-400">5 Subjects</span>
                  </div>
                  <h3 className="text-lg font-bold text-white">Class 10 Excel Template</h3>
                  <p className="text-xs text-slate-400 mt-2 leading-relaxed">
                    Includes mandatory columns: <strong className="text-white">Student_ID, Gmail, Student_Name, Exam_Type, Tamil, English, Mathematics, Science, Social_Science</strong>.
                  </p>
                </div>

                <div className="mt-6 space-y-3">
                  <a href="class10_marks_template.csv" download="class10_marks_template.csv"
                    className="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-blue-600/30 text-center block hover:scale-[1.01] transition-all">
                    📥 Download Class 10 Template (.CSV)
                  </a>

                  <label className="w-full py-3 bg-slate-900 border border-blue-500/40 hover:border-blue-400 text-blue-300 font-bold text-xs rounded-xl text-center cursor-pointer block transition-all">
                    📤 Upload Class 10 Excel File
                    <input type="file" accept=".xlsx,.xls,.csv" onChange={e=>handleFileUpload(e, '10')} className="hidden"/>
                  </label>
                </div>
              </div>

              {/* Class 12 Template Box */}
              <div className="glass rounded-3xl p-6 border border-purple-500/30 flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between mb-3">
                    <span className="px-2.5 py-1 text-xs font-black bg-purple-600/30 text-purple-300 border border-purple-500/40 rounded-full">📕 Class 12 Template</span>
                    <span className="text-[10px] font-bold text-slate-400">6 Subjects</span>
                  </div>
                  <h3 className="text-lg font-bold text-white">Class 12 Excel Template</h3>
                  <p className="text-xs text-slate-400 mt-2 leading-relaxed">
                    Includes mandatory columns: <strong className="text-white">Student_ID, Gmail, Student_Name, Exam_Type, Physics, Chemistry, Mathematics, Computer_Science, Biology, English_Core</strong>.
                  </p>
                </div>

                <div className="mt-6 space-y-3">
                  <a href="class12_marks_template.csv" download="class12_marks_template.csv"
                    className="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-purple-600/30 text-center block hover:scale-[1.01] transition-all">
                    📥 Download Class 12 Template (.CSV)
                  </a>

                  <label className="w-full py-3 bg-slate-900 border border-purple-500/40 hover:border-purple-400 text-purple-300 font-bold text-xs rounded-xl text-center cursor-pointer block transition-all">
                    📤 Upload Class 12 Excel File
                    <input type="file" accept=".xlsx,.xls,.csv" onChange={e=>handleFileUpload(e, '12')} className="hidden"/>
                  </label>
                </div>
              </div>

            </div>

            {uploadStatus&&(
              <div className={`p-4 rounded-2xl border text-xs font-bold text-center ${uploadStatus.startsWith('✅')?'bg-emerald-500/20 border-emerald-500/40 text-emerald-300':'bg-rose-500/20 border-rose-500/40 text-rose-300'}`}>
                {uploadStatus}
              </div>
            )}
          </div>
        )}

        {/* TAB 3: STUDENTS DIRECTORY */}
        {activeTab==='students'&&(
          <div className="space-y-5 slide-up">
            <div className="glass rounded-3xl p-6">
              <div className="flex items-center justify-between mb-4">
                <h2 className="text-xl font-bold text-white">👥 Student Database &amp; Registered Gmails</h2>
                <div className="flex gap-2">
                  <button onClick={()=>setSelectedStd('10')} className={`px-3 py-1 text-xs font-bold rounded-lg ${selectedStd==='10'?'bg-blue-600 text-white':'bg-slate-800 text-slate-400'}`}>Class 10 ({students10.length})</button>
                  <button onClick={()=>setSelectedStd('12')} className={`px-3 py-1 text-xs font-bold rounded-lg ${selectedStd==='12'?'bg-purple-600 text-white':'bg-slate-800 text-slate-400'}`}>Class 12 ({students12.length})</button>
                </div>
              </div>

              <div className="overflow-x-auto rounded-2xl border border-slate-800">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-900/80 text-[10px] uppercase text-slate-400 font-bold">
                    <tr>
                      <th className="py-3 px-4">Student ID</th>
                      <th className="py-3 px-4">Student Name</th>
                      <th className="py-3 px-4">Section</th>
                      <th className="py-3 px-4">Roll No</th>
                      <th className="py-3 px-4">Registered Gmail</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60">
                    {(selectedStd==='10'?students10:students12).map(s=>(
                      <tr key={s.studentId} className="hover:bg-slate-800/30">
                        <td className="py-3 px-4 font-mono font-bold text-amber-400">{s.studentId}</td>
                        <td className="py-3 px-4 font-bold text-white flex items-center gap-2">
                          <img src={s.avatarUrl} alt="" className="w-7 h-7 rounded-full object-cover"/>
                          {s.name}
                        </td>
                        <td className="py-3 px-4 font-bold text-slate-300">Section {s.section}</td>
                        <td className="py-3 px-4 font-mono text-slate-400">{s.rollNo}</td>
                        <td className="py-3 px-4 font-mono text-emerald-400 font-bold">{s.gmail}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        )}

      </main>

      <footer className="py-3 border-t border-slate-800 text-center text-xs text-slate-500">
        S. D. Sion Matric. Hr. Sec. School · Admin Hub
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
