// ─── REPORT CARD MODAL ────────────────────────────────────────────
function ReportModal({student, marks, onClose}){
  const myMarks=marks.filter(m=>m.studentId===student.studentId);
  const marks10=myMarks.filter(m=>m.standard==='10');
  const marks12=myMarks.filter(m=>m.standard==='12');

  const calcAvg=arr=>arr.length?Math.round(arr.reduce((a,m)=>a+(m.marksObtained/m.maxMarks)*100,0)/arr.length):null;
  const overall=calcAvg(myMarks);
  const avg10=calcAvg(marks10);
  const avg12=calcAvg(marks12);

  const gradeLabel=p=>p>=90?'A+':p>=80?'A':p>=70?'B':p>=60?'C':'F';
  const gradeBadge=p=>p>=90?'text-emerald-400 border-emerald-500/40 bg-emerald-500/15':p>=80?'text-teal-400 border-teal-500/40 bg-teal-500/15':p>=70?'text-indigo-400 border-indigo-500/40 bg-indigo-500/15':p>=60?'text-amber-400 border-amber-500/40 bg-amber-500/15':'text-rose-400 border-rose-500/40 bg-rose-500/15';

  const SubjectRows=({arr,color})=>{
    const subMap={};
    arr.forEach(m=>{if(!subMap[m.subject])subMap[m.subject]={ob:0,mx:0};subMap[m.subject].ob+=m.marksObtained;subMap[m.subject].mx+=m.maxMarks;});
    return Object.entries(subMap).map(([s,d])=>{
      const p=Math.round(d.ob/d.mx*100);
      return(
        <div key={s}>
          <div className="flex justify-between text-xs mb-1">
            <span className="font-semibold text-slate-200">{s}</span>
            <div className="flex gap-1 items-center">
              <span className="font-extrabold text-white">{p}%</span>
              <span className={`text-[10px] font-extrabold border px-1.5 py-0.5 rounded ${gradeBadge(p)}`}>{gradeLabel(p)}</span>
            </div>
          </div>
          <div className="h-2 bg-slate-900 rounded-full overflow-hidden border border-slate-800 mb-2">
            <div className={`h-full rounded-full ${color}`} style={{width:`${p}%`}}/>
          </div>
        </div>
      );
    });
  };

  return(
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm" onClick={onClose}>
      <div className="glass rounded-3xl w-full max-w-xl max-h-[90vh] overflow-y-auto shadow-2xl" onClick={e=>e.stopPropagation()}>
        {/* Header */}
        <div className="bg-gradient-to-r from-purple-600/15 to-pink-600/15 border-b border-slate-800 p-5 rounded-t-3xl flex items-center gap-4">
          <img src={student.avatarUrl} alt="" className="w-14 h-14 rounded-2xl object-cover ring-4 ring-purple-500/30 flex-shrink-0"/>
          <div className="flex-1 min-w-0">
            <h2 className="text-lg font-extrabold text-white">{student.name}</h2>
            <p className="text-xs text-slate-400">{student.rollNo} · Section {student.section}</p>
            <p className="text-[11px] text-slate-400 truncate">{student.gmail}</p>
            <div className="flex items-center gap-2 mt-1.5 flex-wrap">
              <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${student.standard==='10'?'std10':'std12'}`}>Std {student.standard}</span>
              {overall!=null&&<span className={`text-[10px] font-extrabold px-2 py-0.5 rounded-full border ${gradeBadge(overall)}`}>{gradeLabel(overall)} · {overall}%</span>}
              <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${student.attendance>=85?'text-emerald-400 border-emerald-500/30 bg-emerald-500/10':student.attendance>=75?'text-amber-400 border-amber-500/30 bg-amber-500/10':'text-rose-400 border-rose-500/30 bg-rose-500/10'}`}>
                Att: {student.attendance}%
              </span>
            </div>
          </div>
          <button onClick={onClose} className="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 text-xl flex-shrink-0">✕</button>
        </div>

        <div className="p-5 space-y-5">
          {/* Standard 10 */}
          {marks10.length>0&&(
            <div className="bg-blue-600/5 border border-blue-500/20 rounded-2xl p-4">
              <div className="flex items-center justify-between mb-3">
                <h3 className="text-sm font-extrabold text-blue-300">📘 Standard 10</h3>
                {avg10!=null&&<span className={`text-xs font-extrabold border px-2 py-0.5 rounded-full ${gradeBadge(avg10)}`}>{avg10}% · {gradeLabel(avg10)}</span>}
              </div>
              <SubjectRows arr={marks10} color="bg-gradient-to-r from-blue-500 to-indigo-500"/>
            </div>
          )}

          {/* Standard 12 */}
          {marks12.length>0&&(
            <div className="bg-purple-600/5 border border-purple-500/20 rounded-2xl p-4">
              <div className="flex items-center justify-between mb-3">
                <h3 className="text-sm font-extrabold text-purple-300">📕 Standard 12</h3>
                {avg12!=null&&<span className={`text-xs font-extrabold border px-2 py-0.5 rounded-full ${gradeBadge(avg12)}`}>{avg12}% · {gradeLabel(avg12)}</span>}
              </div>
              <SubjectRows arr={marks12} color="bg-gradient-to-r from-purple-500 to-pink-500"/>
            </div>
          )}

          {/* Full marks table */}
          {myMarks.length>0&&(
            <div className="overflow-x-auto rounded-xl border border-slate-800">
              <table className="w-full text-xs">
                <thead className="bg-slate-900/80">
                  <tr className="text-[10px] font-bold uppercase text-slate-400">
                    <th className="py-2.5 px-3 text-left">Std</th>
                    <th className="py-2.5 px-3 text-left">Subject</th>
                    <th className="py-2.5 px-3 text-left">Exam</th>
                    <th className="py-2.5 px-3 text-center">Score</th>
                    <th className="py-2.5 px-3 text-center">%</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60">
                  {myMarks.map((m,i)=>{
                    const p=Math.round(m.marksObtained/m.maxMarks*100);
                    return(
                      <tr key={i} className="hover:bg-slate-800/30">
                        <td className="py-2 px-3"><span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-md ${m.standard==='10'?'std10':'std12'}`}>Std {m.standard}</span></td>
                        <td className="py-2 px-3 font-semibold text-white">{m.subject}</td>
                        <td className="py-2 px-3 text-slate-300">{m.examType}</td>
                        <td className="py-2 px-3 text-center font-bold text-white">{m.marksObtained}/{m.maxMarks}</td>
                        <td className="py-2 px-3 text-center font-bold">{p}%</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
          {myMarks.length===0&&<p className="text-center text-slate-500 text-xs py-6">No marks found for this student.</p>}
        </div>
      </div>
    </div>
  );
}

function App(){
  const [students, setStudents]=useState([]);
  const [marks, setMarks]=useState([]);
  const [events, setEvents]=useState([]);
  const [tab, setTab]=useState('overview');
  const [search, setSearch]=useState('');
  const [stdFilter, setStdFilter]=useState('All');
  const [reportStudent, setReportStudent]=useState(null);

  // Sync state
  const [isDragging, setIsDragging]=useState(false);
  const [syncStatus, setSyncStatus]=useState(null);
  const [syncMsg, setSyncMsg]=useState('');
  const [syncLog, setSyncLog]=useState([]);

  // Broadcast state
  const [bForm, setBForm]=useState({title:'',description:'',type:'Announcement',category:'Academic',priority:'General'});
  const [bSent, setBSent]=useState(false);

  const fileInputRef=useRef();

  useEffect(()=>{
    seedData();
    localStorage.setItem('ap_auth','admin');
    loadData();
  },[]);

  const loadData=()=>{
    setStudents(JSON.parse(localStorage.getItem('ap_students')||'[]'));
    setMarks(JSON.parse(localStorage.getItem('ap_marks')||'[]'));
    setEvents(JSON.parse(localStorage.getItem('ap_events')||'[]'));
  };

  const parseExcel=useCallback((file)=>{
    setSyncStatus(null);setSyncLog([]);
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'binary'});
        const log=[];
        let ps=null,pm=null,pe=null;
        wb.SheetNames.forEach(name=>{
          const ws=wb.Sheets[name];
          const data=XLSX.utils.sheet_to_json(ws,{defval:''});
          const lower=name.toLowerCase().trim();
          if(lower.includes('student')){
            ps=data.map(r=>({
              studentId:String(r['Student ID']||r['studentId']||''),
              name:String(r['Name']||r['name']||''),
              standard:String(r['Standard']||r['standard']||r['Std']||''),
              section:String(r['Section']||r['section']||'A'),
              gmail:String(r['Gmail']||r['gmail']||r['Email']||r['email']||'').toLowerCase(),
              rollNo:String(r['Roll No']||r['rollNo']||r['Roll Number']||''),
              attendance:parseFloat(r['Attendance']||r['attendance']||0),
              avatarUrl:String(r['Profile Image URL']||r['avatarUrl']||'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&q=80'),
            })).filter(s=>s.studentId&&s.name&&s.gmail);
            log.push(`✅ Students sheet → ${ps.length} records`);
          } else if(lower.includes('mark')||lower.includes('grade')){
            pm=data.map(r=>({
              studentId:String(r['Student ID']||r['studentId']||''),
              standard:String(r['Standard']||r['standard']||r['Std']||''),
              subject:String(r['Subject']||r['subject']||''),
              examType:String(r['Exam Type']||r['examType']||''),
              marksObtained:parseFloat(r['Marks Obtained']||r['marksObtained']||0),
              maxMarks:parseFloat(r['Max Marks']||r['maxMarks']||100),
              date:String(r['Date']||r['date']||''),
            })).filter(m=>m.studentId&&m.subject);
            log.push(`✅ Marks sheet → ${pm.length} records`);
          } else if(lower.includes('event')||lower.includes('announ')){
            pe=data.map((r,i)=>({
              id:String(r['ID']||r['id']||`EX-${i+100}`),
              type:String(r['Type']||r['type']||'Event'),
              title:String(r['Title']||r['title']||''),
              description:String(r['Description']||r['description']||''),
              date:String(r['Date']||r['date']||''),
              category:String(r['Category']||r['category']||'Academic'),
              priority:String(r['Priority']||r['priority']||'General'),
            })).filter(ev=>ev.title);
            log.push(`✅ Events sheet → ${pe.length} records`);
          } else { log.push(`⚠️ Sheet "${name}" skipped`); }
        });
        if(ps?.length)localStorage.setItem('ap_students',JSON.stringify(ps));
        if(pm?.length)localStorage.setItem('ap_marks',JSON.stringify(pm));
        if(pe?.length)localStorage.setItem('ap_events',JSON.stringify(pe));
        const n=[ps,pm,pe].filter(Boolean).length;
        if(n>0){setSyncStatus('success');setSyncMsg(`${n} sheet(s) synced from "${file.name}"`);loadData();}
        else{setSyncStatus('error');setSyncMsg('No recognized sheets found.');}
        setSyncLog(log);
      }catch(err){setSyncStatus('error');setSyncMsg(`Parse error: ${err.message}`);}
    };
    reader.readAsBinaryString(file);
  },[]);

  const handleDrop=useCallback(e=>{
    e.preventDefault();setIsDragging(false);

        {/* ══ BROADCAST ══ */}

                      className="w-full py-2.5 px-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500"/>

                      <p className="font-bold text-white text-sm">{ev.title}</p>
                      {ev.description&&<p className="text-xs text-slate-400 mt-0.5">{ev.description}</p>}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        )}

      </main>

      {reportStudent&&<ReportModal student={reportStudent} marks={marks} onClose={()=>setReportStudent(null)}/>}

      <footer className="border-t border-slate-800/60 py-4">
        <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs">
          <div>
            <p className="font-extrabold text-purple-300">S. D. SION MATRICULATION HIGHER SECONDARY SCHOOL</p>
            <p className="text-slate-500">Admin Portal · Academic Year 2025–2026</p>
          </div>
          <div className="flex gap-3">
            <a href="student.html" className="text-indigo-400 font-semibold hover:text-indigo-300">Student Portal</a>
            <a href="index.html" className="text-rose-400 font-semibold hover:text-rose-300">Logout</a>
          </div>
        </div>
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
